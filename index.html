  // ══ Индивидуалка ══
  /* Неделя сеткой: игроки по строкам, дни по столбцам, в клетке метки разминка / микро / макро.
     Рома 05.10: «когда там просто подряд всё идёт, очень тяжело считывается». Сверху задание
     недели, выходные приглушены. Сетка всегда за выбранную неделю: индивидуалка недельная. */
  const DTYPE = t => { const x = String(t || '').toLowerCase();
    return /off/.test(x) ? 'выходной' : /theory|теор/.test(x) ? 'теория' : /important|game|игр/.test(x) ? 'игровой день' : /practice|прак/.test(x) ? 'праки' : String(t || ''); };
  const weekDays = wk => { const d0 = new Date(wk.lo + 'T12:00:00'), out = [];
    for (let i = 0; i < 7; i++) { const d = new Date(d0); d.setDate(d0.getDate() + i); out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`); }
    return out; };
  const dayInfo = d => (D.idays || {})[d] || {};
  const isOff = d => DTYPE(dayInfo(d).type) === 'выходной';
  const TTAG = [['warmup', 'разминка', 'tw'], ['micro', 'микро', 'tm'], ['macro', 'макро', 'tc']];
  const trItems = x => TTAG.filter(([k]) => x[k]).map(([k, l, c]) => `<div class="ti"><span class="tt ${c}">${l}</span><span>${esc(x[k])}</span></div>`).join('');
  /* Правило Ромы 13.10: прочерк значит «ничего не делал», пустая клетка значит «не заполнил»,
     за это штраф. st несёт по букве на разминку, микро и макро: d сделал, n прочерк, e пусто.
     У записей до 13.10 st нет, там прочерк от пустого не отличали. Пустое ловим только
     за прошедшие дни: сегодняшний ещё могут дописать. */
  const IRULE = 'Прочерк значит, что в этот день ничего не делал. <b>Пустая клетка значит, что не заполнил, за это штраф.</b> Красным отмечено пустое за прошедшие дни.';
  const did = x => !!(x && (x.warmup || x.micro || x.macro));
  const holes = x => x && x.st && x.date < D.built ? TTAG.filter((_, i) => x.st[i] === 'e').map(([, l]) => l) : [];
  const holeSum = recs => { let cells = 0, days = 0; for (const x of recs) { const n = holes(x).length; cells += n; days += n ? 1 : 0; } return {cells, days}; };
  const dayWord = x => !x ? 'нет записи' : did(x) ? 'тренировался' : holes(x).length ? 'не заполнил'
    : x.st && x.st.includes('e') ? 'ещё не заполнено' : x.st ? 'ничего не делал' : 'ничего';
  const dayCell = x => {
    if (!x) return '<span class="none" title="строки в листе нет">—</span>';
    const h = holes(x);
    return trItems(x) + (did(x) || h.length ? '' : `<span class="nil">${dayWord(x)}</span>`)
      + (h.length ? `<div class="ihole">не заполнил: ${h.join(', ')}</div>` : '');
  };
  function secIndividual() {
    const wk = W[S.week], days = weekDays(wk);
    const nicks = S.player === 'all' ? D.roster.map(r => r.nick) : [S.player];
    const tasks = [...new Set(days.map(d => dayInfo(d).task).filter(Boolean))];
    const task = tasks.length ? `<div class="card task"><span class="k">задание недели</span>${tasks.map(t => `<p>${esc(t)}</p>`).join('')}</div>` : '';
    const wtr = D.training.filter(x => x.date >= wk.lo && x.date <= wk.hi);
    // с 19.10 индивидуалка ведётся в дневниках: старую сетку за такие недели не рисуем
    if (!wtr.length && (D.diary || []).some(x => x.date >= wk.lo && x.date <= wk.hi)) return '';
    const old = wtr.some(x => !x.st) ? '<p class="muted small">В эту неделю прочерк от пустой клетки ещё не отличали, пустое не отмечено.</p>' : '';
    const legend = `<div class="legend ileg">${TTAG.map(([, l, c]) => `<span><span class="tt ${c}">${l}</span></span>`).join('')}<span class="muted">приглушён выходной</span></div><p class="irule">${IRULE}</p>${old}`;
    const byNick = nick => new Map(wtr.filter(x => x.p === nick).map(x => [x.date, x]));
    const holeTxt = hs => `не заполнил ${plural(hs.cells, 'клетку', 'клетки', 'клеток')} за ${plural(hs.days, 'день', 'дня', 'дней')}`;
    let body;
    if (nicks.length === 1) {                       // один игрок: дни сверху вниз, так читается и на телефоне
      const by = byNick(nicks[0]), hs = holeSum([...by.values()]);
      body = `<div class="card ilist">${hs.cells ? `<p class="ihead crit">${holeTxt(hs)}</p>` : ''}${days.map(d => `<div class="iday${isOff(d) ? ' off' : ''}"><div class="dd"><b>${wday(d)} ${ddmm(d)}</b><small>${esc(DTYPE(dayInfo(d).type))}</small></div>`
        + `<div>${by.has(d) ? dayCell(by.get(d)) : '<span class="muted">нет записи</span>'}</div></div>`).join('')}${legend}</div>`;
    } else {
      const head = '<tr><th></th>' + days.map(d => `<th class="dcol${isOff(d) ? ' off' : ''}"><b>${wday(d)}</b> ${ddmm(d)}<small>${esc(DTYPE(dayInfo(d).type))}</small></th>`).join('') + '<th class="num">дней</th><th class="num">не заполнил</th></tr>';
      const rows = nicks.map(nick => {
        const by = byNick(nick), hs = holeSum([...by.values()]);
        const n = days.filter(d => did(by.get(d))).length;
        return `<tr><th class="nick">${esc(nick)}</th>` + days.map(d => `<td class="icell${isOff(d) ? ' off' : ''}">${dayCell(by.get(d))}</td>`).join('')
          + `<td class="num"><b>${n}</b>/7</td>`
          + (hs.cells ? `<td class="num crit" title="${holeTxt(hs)}"><b>${hs.cells}</b><small>${plural(hs.days, 'день', 'дня', 'дней')}</small></td>` : '<td class="num muted">0</td>') + '</tr>';
      }).join('');
      body = `<div class="card"><div class="scroll"><table class="itab">${head}${rows}</table></div>${legend}</div>`;
    }
    return section(`Индивидуалка ${ddmm(wk.lo)} — ${ddmm(wk.hi)}`, task + body);
  }

  // ══ Расписание ══
  /* Рома 19.10: расписание по воскресеньям уходит на сайт, чтобы листать неделю и вспоминать,
     что делали, не открывая таблицу. Пустые часы скрыты, одинаковые подряд склеены в одну клетку.
     Время московское. */
  function secSchedule() {
    const wk = W[S.week], sc = (D.schedule || {})[wk.lo];
    if (!sc) return '';
    const rows = sc.slots.map((s, i) => ({...s, i})).filter(s => s.cells.some(Boolean));
    const avail = Object.entries(sc.avail || {});
    if (!rows.length && !avail.length) return '';
    const span = rows.map(() => Array(7).fill(1));
    for (let c = 0; c < 7; c++) {
      for (let r = 0; r < rows.length; r++) {
        if (!span[r][c] || !rows[r].cells[c]) continue;
        let k = r + 1;
        while (k < rows.length && rows[k].i === rows[k - 1].i + 1 && rows[k].cells[c] === rows[r].cells[c]) { span[k][c] = 0; k++; }
        span[r][c] = k - r;
      }
    }
    const head = `<thead><tr><th class="t">мск</th>${sc.days.map(d => `<th>${wday(d)} ${ddmm(d)}</th>`).join('')}</tr></thead>`;
    const body = rows.map((s, r) => `<tr><th class="t">${esc(s.msk)}</th>` + s.cells.map((v, c) => !span[r][c] ? ''
      : v ? `<td class="slot"${span[r][c] > 1 ? ` rowspan="${span[r][c]}"` : ''}>${esc(v)}</td>` : '<td></td>').join('') + '</tr>').join('');
    const av = avail.length ? `<tr class="gap"><th colspan="8">когда могут играть</th></tr>`
      + avail.map(([n, cells]) => `<tr class="av"><th>${esc(n)}</th>${cells.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('') : '';
    return section(`Расписание ${ddmm(wk.lo)} — ${ddmm(wk.hi)}`, `<div class="card"><div class="scroll"><table class="sched">${head}<tbody>${body}${av}</tbody></table></div><p class="muted small">Время московское. Копия из листа «Расписание», хранится и после того, как лист перепишут.</p></div>`);
  }

  // ══ Дневник ══
  /* Новая индивидуалка с 19.10: у каждого свой лист с ником по системе leckr из Entropiq.
     Игру A/B/C по стате ставим мы после праков и офок, игрок рядом ставит свою по ощущениям.
     Правило то же, что у индивидуалки: прочерк значит «не было», пустая клетка за прошедший день
     значит «не заполнил». Аим-рутина минимум 3 раза в неделю.
     В st по букве на поле из DF в том же порядке, что DIARY_MUST в report_week.py.
     До новых колонок полей было 10, такие записи читаются по DF_OLD.
     Данных за день много, поэтому в общей таблице только короткие цифры и число пустых клеток,
     а тексты целиком видны, когда выбран игрок. */
  const DF = [['type', 'тип дня'], ['bed', 'лёг'], ['sleep', 'уснул'], ['wake', 'проснулся'], ['mood', 'настроение'],
    ['stress', 'стресс'], ['self', 'игра по ощущениям'], ['caf', 'кофеин'], ['food', 'еда'], ['sport', 'спорт'],
    ['wu', 'разминка'], ['dm', 'ДМ'], ['aim', 'аим-рутина'], ['tr', 'тренировка'], ['err', 'над какой ошибкой работал']];
  const DF_OLD = ['type', 'bed', 'sleep', 'wake', 'mood', 'stress', 'caf', 'food', 'wu', 'tr'];
  const DLAB = Object.fromEntries(DF);
  const AIM_MIN = 3;
  const dKeys = x => x.st.length === DF.length ? DF.map(([k]) => k) : DF_OLD;
  const dDash = (x, k) => !!(x && x.st && x.st[dKeys(x).indexOf(k)] === 'n');
  const dHoles = x => x && x.st && x.date < D.built ? dKeys(x).filter((_, i) => x.st[i] === 'e').map(k => DLAB[k]) : [];
  const minutes = v => { const n = parseFloat(String(v || '').replace(',', '.')); return Number.isNaN(n) ? 0 : n; };
  const hm = t => { const m = String(t || '').trim().match(/^(\d{1,2})(?:[:.](\d{2}))?(?!\d)/); return m && Number(m[1]) < 24 ? Number(m[1]) + Number(m[2] || 0) / 60 : null; };
  const sleepH = x => { const a = hm(x.sleep) ?? hm(x.bed), b = hm(x.wake); if (a == null || b == null) return null; const h = (b - a + 24) % 24; return h > 0 && h <= 16 ? h : null; };
  const hrs = h => h.toFixed(1).replace('.', ',');
  const abcTag = (v, own) => { const k = String(v || '').trim().toUpperCase().slice(0, 1); return ['A', 'B', 'C'].includes(k) ? `<span class="abc ${k}${own ? ' own' : ''}" title="${own ? 'сам по ощущениям' : 'по стате'}">${k}</span>` : ''; };
  const abcPair = x => { const s = abcTag(x.abc), o = abcTag(x.self, true); return s || o ? `<span class="abcp">${s || '<span class="abc none" title="по стате пока нет">·</span>'}${o ? ' ' + o : ''}</span>` : ''; };
  const holeWord = n => `не заполнил ${plural(n, 'клетку', 'клетки', 'клеток')}`;
  const dCell = x => {
    if (!x) return '<span class="none">—</span>';
    const h = dHoles(x), sl = sleepH(x);
    const line = (...p) => { p = p.filter(Boolean); return p.length ? `<span class="dl">${p.join(' · ')}</span>` : ''; };
    return abcPair(x) + (x.type ? `<span class="dty">${esc(x.type)}</span>` : '')
      + line(sl != null ? `сон <b>${hrs(sl)} ч</b>` : '')
      + line(x.mood ? `настр. <b>${esc(x.mood)}</b>` : '', x.stress ? `стресс <b>${esc(x.stress)}</b>` : '')
      + line(minutes(x.aim) ? `аим <b>${minutes(x.aim)}</b>` : '', minutes(x.sport) ? `спорт <b>${minutes(x.sport)}</b>` : '')
      + (h.length ? `<div class="ihole" title="${h.join(', ')}">${holeWord(h.length)}</div>` : '');
  };
  // один день одного игрока: короткое строкой фишек, тексты отдельными строками с переносом
  const dDay = x => {
    const h = dHoles(x), sl = sleepH(x);
    const val = k => dDash(x, k) ? '<span class="muted">—</span>' : x[k] ? `<b>${esc(x[k])}</b>` : '';
    const chips = [sl != null ? `<span class="dl">сон <b>${hrs(sl)} ч</b></span>` : '']
      .concat([['лёг', 'bed'], ['уснул', 'sleep'], ['проснулся', 'wake'], ['настроение', 'mood'], ['стресс', 'stress'],
        ['кофеин', 'caf'], ['еда', 'food'], ['спорт, мин', 'sport'], ['аим-рутина, мин', 'aim']]
        .map(([lab, k]) => { const v = val(k); return v ? `<span class="dl">${lab} ${v}</span>` : ''; })).join('');
    const texts = [['разминка', 'wu'], ['ДМ', 'dm'], ['тренировка', 'tr'], ['над какой ошибкой работал', 'err'], ['заметки', 'note']]
      .map(([lab, k]) => { const v = dDash(x, k) ? '<span class="muted">—</span>' : x[k] ? esc(x[k]) : ''; return v ? `<div class="dtx"><span class="k">${lab}</span><p>${v}</p></div>` : ''; }).join('');
    return abcPair(x) + (chips ? `<div class="dfields">${chips}</div>` : '') + texts
      + (h.length ? `<div class="ihole">${holeWord(h.length)}: ${h.join(', ')}</div>` : '');
  };
  function secDiary() {
    const wk = W[S.week], days = weekDays(wk);
    const nicks = S.player === 'all' ? D.roster.map(r => r.nick) : [S.player];
    const recs = (D.diary || []).filter(x => x.date >= wk.lo && x.date <= wk.hi && nicks.includes(x.p));
    if (!recs.length) return '';
    const by = nick => new Map(recs.filter(x => x.p === nick).map(x => [x.date, x]));
    const avgOf = (l, f) => mean(l.map(f).map(v => v == null || v === '' ? null : Number(String(v).replace(',', '.'))).filter(v => v != null && !Number.isNaN(v)));
    const rule = `<p class="irule">${IRULE}</p><p class="muted small">Первая буква A/B/C по стате, её ставим мы после праков и офок. Вторая, в рамке, это оценка игрока по ощущениям. Аим-рутина минимум ${AIM_MIN} раза в неделю.${nicks.length > 1 ? ' В общей таблице видно, сколько клеток пустые. Какие именно и все записи целиком видны, если выбрать игрока.' : ''} Система из дневника leckr времён Entropiq.</p>`;
    let body;
    if (nicks.length === 1) {
      const m = by(nicks[0]);
      const hs = [...m.values()].reduce((s, x) => { const n = dHoles(x).length; return {cells: s.cells + n, days: s.days + (n ? 1 : 0)}; }, {cells: 0, days: 0});
      body = `<div class="card ilist dlist">${hs.cells ? `<p class="ihead crit">${holeWord(hs.cells)} за ${plural(hs.days, 'день', 'дня', 'дней')}</p>` : ''}${days.map(d => { const x = m.get(d);
        return `<div class="iday"><div class="dd"><b>${wday(d)} ${ddmm(d)}</b><small>${esc(x ? x.type : '')}</small></div><div class="dbody">${x ? dDay(x) : '<span class="muted">нет записи</span>'}</div></div>`; }).join('')}${rule}</div>`;
    } else {
      const head = '<tr><th class="nick"></th>' + days.map(d => `<th class="dcol"><b>${wday(d)}</b> ${ddmm(d)}</th>`).join('')
        + '<th class="num">сон</th><th class="num">настр.</th><th class="num">стресс</th><th class="num">A/B/C<small>по стате</small></th><th class="num">A/B/C<small>сам</small></th>'
        + `<th class="num" title="дней с аим-рутиной, минимум ${AIM_MIN}">аим<small>дней</small></th><th class="num">спорт<small>мин</small></th><th class="num">не заполнил</th></tr>`;
      const cnt = (l, f) => ['A', 'B', 'C'].map(k => l.filter(x => String(f(x) || '').trim().toUpperCase().startsWith(k)).length).join('/');
      const rows = nicks.map(nick => {
        const m = by(nick), l = [...m.values()];
        const hs = l.reduce((s, x) => { const n = dHoles(x).length; return {cells: s.cells + n, days: s.days + (n ? 1 : 0)}; }, {cells: 0, days: 0});
        const aimDays = l.filter(x => minutes(x.aim) > 0).length, sport = l.reduce((s, x) => s + minutes(x.sport), 0);
        const aimCls = wk.hi < D.built && aimDays < AIM_MIN ? 'num crit' : 'num';
        return `<tr><th class="nick">${esc(nick)}</th>` + days.map(d => `<td class="icell">${dCell(m.get(d))}</td>`).join('')
          + `<td class="num">${fmt(mean(l.map(sleepH).filter(v => v != null)), 1)}</td><td class="num">${fmt(avgOf(l, x => x.mood), 1)}</td><td class="num">${fmt(avgOf(l, x => x.stress), 1)}</td>`
          + `<td class="num">${cnt(l, x => x.abc)}</td><td class="num">${cnt(l, x => x.self)}</td>`
          + `<td class="${aimCls}"><b>${aimDays}</b></td><td class="num">${sport || '<span class="muted">0</span>'}</td>`
          + (hs.cells ? `<td class="num crit" title="${holeWord(hs.cells)}"><b>${hs.cells}</b><small>${plural(hs.days, 'день', 'дня', 'дней')}</small></td>` : '<td class="num muted">0</td>') + '</tr>';
      }).join('');
      body = `<div class="card"><div class="scroll"><table class="itab dtab">${head}${rows}</table></div>${rule}</div>`;
    }
    return section(`Дневник ${ddmm(wk.lo)} — ${ddmm(wk.hi)}`, body);
  }

  // ══ Стабильность A/B/C ══
  /* Рома 19.10: ABC-графики на сайт, чтобы смотреть стабильность игрока и команды в любой
     период календаря. Единица — день. Линии C и A у каждого свои и заморожены по D.abc.base:
     там у каждого 20% дней C и 20% A, цель сдвинуть к 10/65/25. Команда по результату:
     доля выигранных раундов за день. Разброс «дни или карты» — по картам периода. */
  function abcDays(ms) {
    const pl = new Map(), team = new Map();
    for (const m of ms) {
      if (m.us == null || m.them == null || !(m.us + m.them)) continue;
      const n = m.us + m.them, t = team.get(m.date) || [0, 0];
      t[0] += m.us; t[1] += n; team.set(m.date, t);
      for (const p of m.players) {
        if (p.r == null) continue;
        const mp = pl.get(p.p) || new Map(), a = mp.get(m.date) || [0, 0];
        a[0] += p.r * n; a[1] += n; mp.set(m.date, a); pl.set(p.p, mp);
      }
    }
    const fin = mp => [...mp].map(([d, [s, n]]) => [d, s / n]).sort((a, b) => a[0] < b[0] ? -1 : 1);
    return {team: fin(team), pl: new Map([...pl].map(([k, v]) => [k, fin(v)]))};
  }
  const abcL = (x, ln) => x < ln.c ? 'C' : x > ln.a ? 'A' : 'B';
  function bell(days, ln, {lo, hi, pct = false, label = '', override = null}) {
    const w = 640, h = 136, pl = 12, pr = 12, top = 24, base = 94;
    const X = v => pl + (w - pl - pr) * (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo);
    const sd = Math.max(ln.sd || 0, 1e-3), pdf = v => Math.exp(-0.5 * ((v - ln.mid) / sd) ** 2);
    const pts = [];
    for (let i = 0; i <= 160; i++) { const v = lo + (hi - lo) * i / 160; pts.push([v, base - (base - top) * pdf(v)]); }
    const area = (a, b) => { const ps = pts.filter(p => p[0] >= a && p[0] <= b); if (ps.length < 2) return '';
      return `M${X(ps[0][0]).toFixed(1)} ${base} ` + ps.map(p => `L${X(p[0]).toFixed(1)} ${p[1].toFixed(1)}`).join(' ') + ` L${X(ps[ps.length - 1][0]).toFixed(1)} ${base} Z`; };
    const f = v => pct ? Math.round(100 * v) + '%' : v.toFixed(2);
    let out = `<path class="zc" d="${area(lo, ln.c)}"/><path class="zb" d="${area(ln.c, ln.a)}"/><path class="za" d="${area(ln.a, hi)}"/>`
      + `<path class="bell" d="${pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)} ${p[1].toFixed(1)}`).join(' ')}"/>`
      + `<line class="axis" x1="${pl}" x2="${w - pr}" y1="${base}" y2="${base}"/>`;
    for (const v of [ln.c, ln.a]) out += `<line class="cut" x1="${X(v).toFixed(1)}" x2="${X(v).toFixed(1)}" y1="${top - 8}" y2="${base}"/><text class="tick" x="${X(v).toFixed(1)}" y="${top - 11}" text-anchor="middle">${f(v)}</text>`;
    days.forEach(([d, v], i) => {
      const k = abcL(v, ln), ov = override ? override(d) : null, L = ov || k;
      out += `<circle class="dot ${L}${ov && ov !== k ? ' ov' : ''}" cx="${X(v).toFixed(1)}" cy="${(base + 12 + (i % 3) * 9).toFixed(1)}" r="4.5"><title>${wday(d)} ${ddmm(d)}: ${f(v)}, ${L}${ov && ov !== k ? `, поправлено руками, по стате ${k}` : ''}</title></circle>`;
    });
    out += `<text class="tick" x="${pl}" y="${h - 2}">${f(lo)}</text><text class="tick" x="${w - pr}" y="${h - 2}" text-anchor="end">${f(hi)}</text>`;
    return `<svg class="chart abcsvg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${out}</svg>`;
  }
  // разброс одной и той же величины: от дня к дню и от карты к карте внутри дня (дисперсионный анализ)
  function spread(rows) {
    const g = new Map();
    for (const [d, v] of rows) { if (!g.has(d)) g.set(d, []); g.get(d).push(v); }
    const N = rows.length, k = g.size;
    if (k < 2 || N - k < 1) return null;
    const grand = rows.reduce((s, r) => s + r[1], 0) / N;
    let ssw = 0, ssb = 0, sn2 = 0;
    for (const vs of g.values()) {
      const m = vs.reduce((a, b) => a + b, 0) / vs.length;
      for (const v of vs) ssw += (v - m) ** 2;
      ssb += vs.length * (m - grand) ** 2; sn2 += vs.length ** 2;
    }
    const msw = ssw / (N - k), msb = ssb / (k - 1), n0 = (N - sn2 / N) / (k - 1);
    return {day: Math.sqrt(Math.max(0, (msb - msw) / n0)), map: Math.sqrt(msw), days: k, maps: N};
  }
  function secABC() {
    if (!D.abc || !D.abc.team) return '';
    const ms = pick(cur()), dv = abcDays(ms), base = D.abc.base;
    const dmap = new Map((D.diary || []).filter(x => x.abc).map(x => [x.p + '|' + x.date, String(x.abc).trim().toUpperCase().slice(0, 1)]));
    const share = (days, ln) => { const c = {A: 0, B: 0, C: 0}; for (const [, v] of days) c[abcL(v, ln)]++; return {c, n: days.length}; };
    const pcts = s => s.n ? ['C', 'B', 'A'].map(k => Math.round(100 * s.c[k] / s.n)) : null;
    const shareTxt = s => s.n ? `C ${s.c.C} · B ${s.c.B} · A ${s.c.A} из ${plural(s.n, 'дня', 'дней', 'дней')}, это <b>${pcts(s).join('/')}</b>` : '<span class="muted">игровых дней нет</span>';
    const row = (sub, days, ln, opt) => `<div class="abcrow"><div class="abchead"><span class="muted">${sub}</span><span>${shareTxt(share(days, ln))}</span></div>${bell(days, ln, opt)}</div>`;

    // команда: как часто в плохой, обычной и отличной форме, по результату дня
    const tl = D.abc.team, td = dv.team, ts = share(td, tl), tp = pcts(ts);
    const NAME = {C: 'плохая форма', B: 'обычная форма', A: 'отличная форма'};
    const stack = (vals, label) => `<div class="abcstack"><span class="lab">${label}</span><div class="sb">${vals ? ['C', 'B', 'A'].map((k, i) => vals[i] ? `<span class="${k}" style="width:${vals[i]}%">${vals[i]}%</span>` : '').join('') : '<span class="muted small">нет игровых дней</span>'}</div></div>`;
    const tiles = `<div class="abct">${['C', 'B', 'A'].map((k, i) => `<div class="t ${k}"><div class="k">${NAME[k]}</div><div class="big">${tp ? tp[i] + '%' : '—'}</div><div class="note">${ts.c[k]} из ${plural(ts.n, 'дня', 'дней', 'дней')}</div></div>`).join('')}</div>`;
    const tv = td.map(x => x[1]).concat([tl.c, tl.a]);
    const team = `<div class="card"><h3>Команда <span class="muted">по результату дня, доля выигранных раундов</span></h3>${tiles}
      ${stack(tp, 'за период')}${stack([20, 60, 20], 'база')}${stack([10, 65, 25], 'цель')}
      ${row(`обычный день ${Math.round(100 * tl.mid)}% раундов · C ниже ${Math.round(100 * tl.c)}% · A выше ${Math.round(100 * tl.a)}%`, td, tl,
        {lo: Math.max(0, Math.min(...tv) - 0.05), hi: Math.min(1, Math.max(...tv) + 0.05), pct: true, label: 'A/B/C команды по дням'})}</div>`;

    // игроки: по одному, листаются как голова; ниже сводка по всем
    const nicks = D.roster.map(r => r.nick).filter(n => D.abc.players[n]);
    if (S.player !== S.apFor) { S.apFor = S.player; if (S.player !== 'all') S.ap = Math.max(0, nicks.indexOf(S.player)); }
    const i = ((S.ap % nicks.length) + nicks.length) % nicks.length, nick = nicks[i], ln = D.abc.players[nick];
    const role = (D.roster.find(r => r.nick === nick) || {}).role || '';
    const allv = nicks.flatMap(n => (dv.pl.get(n) || []).map(x => x[1]).concat([D.abc.players[n].c, D.abc.players[n].a]));
    const lo = Math.max(0, Math.min(...allv) - 0.1), hi = Math.max(...allv) + 0.1;
    const sumRows = nicks.map(n => {
      const s = share(dv.pl.get(n) || [], D.abc.players[n]), p = pcts(s);
      return `<tr${n === nick ? ' class="on"' : ''}><th>${esc(n)}</th>${p ? p.map((v, k) => `<td class="num ${['C', 'B', 'A'][k]}">${v}%</td>`).join('') : '<td class="num muted" colspan="3">нет дней</td>'}<td class="num muted">${s.n}</td></tr>`;
    }).join('');
    const players = `<div class="card gchart">
        <div class="ghead"><div class="gwho" id="awho"><b>${esc(nick)}</b><span class="role">${esc(role)}</span><span class="muted small">${i + 1} из ${nicks.length}</span></div></div>
        <div class="gbody"><button type="button" class="gnav" data-anav="-1" aria-label="Предыдущий игрок" aria-describedby="awho">◀</button>
          <div>${row(`обычный день ${fmt(ln.mid, 2)} · C ниже ${fmt(ln.c, 2)} · A выше ${fmt(ln.a, 2)}`, dv.pl.get(nick) || [], ln, {lo, hi, label: `A/B/C ${nick} по дням`, override: d => dmap.get(nick + '|' + d) || null})}</div>
          <button type="button" class="gnav" data-anav="1" aria-label="Следующий игрок" aria-describedby="awho">▶</button></div>
        <div class="scroll"><table class="abcsum"><tr><th></th><th class="num">C</th><th class="num">B</th><th class="num">A</th><th class="num">дней</th></tr>${sumRows}</table></div>
      </div>`;

    // карта по счёту в дне: по строкам листа «Праки», номер считается по всем матчам дня до фильтров.
    // Рома 19.10: по этому графику увидели выносливость и что нам нужно два разминочных прака.
    if (!D._ord) { const cnt = new Map(); for (const m of D.matches) { const k = (cnt.get(m.date) || 0) + 1; cnt.set(m.date, k); m._ord = k; } D._ord = true; }
    const ORD = ['1-я', '2-я', '3-я', '4-я и дальше'];
    const ord = [1, 2, 3, 4].map(o => {
      const l = ms.filter(m => o < 4 ? m._ord === o : m._ord >= 4);
      let w = 0, n = 0;
      for (const m of l) if (m.us != null && m.them != null) { w += m.us; n += m.us + m.them; }
      return {o, n: l.length, tr: mean(l.map(m => mean(m.players.map(p => p.r)))), wr: n ? w / n : null,
        pr: mean(l.flatMap(m => m.players.filter(p => p.p === nick && p.r != null).map(p => p.r)))};
    });
    const omx = Math.max(1.2, ...ord.map(r => r.tr || 0));
    const ordCard = `<div class="card"><h3>Карта по счёту в дне <span class="muted">выносливость</span></h3>
      <div class="scroll"><table class="ordt"><tr><th>карта дня</th><th class="num">карт</th><th>рейтинг пятёрки</th><th class="num">раунды</th><th class="num">${esc(nick)}</th></tr>
      ${ord.map(r => `<tr><th>${ORD[r.o - 1]}</th><td class="num muted">${r.n}</td><td><div class="br"><span class="bar bm" style="width:${r.tr == null ? 0 : (100 * r.tr / omx).toFixed(1)}%"></span><span class="bv">${fmt(r.tr, 2)}</span></div></td><td class="num">${r.wr == null ? '—' : Math.round(100 * r.wr) + '%'}</td><td class="num">${fmt(r.pr, 2)}</td></tr>`).join('')}</table></div>
      <p class="muted small">Номер карты внутри игрового дня по порядку строк в листе «Праки». Раунды это доля выигранных. Справа игрок, открытый выше. По этому графику мы увидели свою выносливость и что нам нужно два разминочных прака.</p></div>`;

    // разброс по картам периода: команда — средний рейтинг пятёрки за карту
    const sp = [['Команда', spread(ms.map(m => { const r = mean(m.players.map(p => p.r)); return r == null ? null : [m.date, r]; }).filter(Boolean))]]
      .concat(D.roster.map(r => r.nick).map(n => [n, spread(ms.flatMap(m => m.players.filter(p => p.p === n && p.r != null).map(p => [m.date, p.r])))]));
    const mx = Math.max(0.05, ...sp.filter(x => x[1]).flatMap(([, s]) => [s.day, s.map]));
    const bar = (v, cls) => `<div class="br"><span class="bar ${cls}" style="width:${(100 * v / mx).toFixed(1)}%"></span><span class="bv">±${v.toFixed(2)}</span></div>`;
    const spHtml = sp.map(([n, s]) => `<div class="spr"><span>${esc(n)}</span>${s ? `<div class="bars">${bar(s.day, 'bd')}${bar(s.map, 'bm')}</div>` : '<span class="muted small">мало игровых дней</span>'}</div>`).join('');
    return section('Стабильность A/B/C', `
      <p class="muted small">Каждая точка это игровой день выбранного периода. Линии C и A у команды и у каждого игрока свои, посчитаны по ${ddmm(base[0])}–${ddmm(base[1])} и заморожены: там 20% дней C и 20% A. Цель сдвинуть расклад к <b>10/65/25</b>. Обведённая точка значит, что букву поправили руками в дневнике.</p>
      ${team}${players}${ordCard}
      <div class="card"><h3>Что сильнее гуляет: дни или карты внутри дня</h3>
        <div class="legend"><span><span class="sw bd"></span>от дня к дню, «сегодня в форме или нет»</span><span><span class="sw bm"></span>от карты к карте в один день</span></div>
        ${spHtml}
        <p class="muted small">Насколько обычно отклоняется рейтинг за карту. Если оранжевая полоса длинная, игрок сильно зависит от дня. Нужно хотя бы два игровых дня с несколькими картами.</p>
      </div>`);
  }

  // ══ Итог недели ══
  /* Итог и план со слов IGL стоят сразу под командой. Темы пракков и записи по дням сняты,
     Рома 05.10: «темы самые разные, расписывать спорно». В конце недели он даёт отчёт
     и оценку, они и встают сюда. */
  function secWeekReport() {
    const wk = W[S.week], pw = S.week > 0 ? W[S.week - 1] : null;
    const inR = (e, w) => w && e.date && e.date >= w.lo && e.date <= w.hi;
    const it = D.journal.filter(e => e.kind === 'итог' && inR(e, wk)).pop();
    const itp = D.journal.filter(e => e.kind === 'итог' && inR(e, pw)).pop();
    const plan = D.journal.filter(e => e.kind === 'план' && inR(e, wk));
    const was = new Map(((itp && itp.scores) || []).map(([k, v]) => [k, v]));
    const scores = ((it && it.scores) || []).map(([k, v]) => `<div class="score"><div class="k">${esc(k)}</div><div class="big">${v}</div>${delta(v, was.has(k) ? was.get(k) : null, 1)}</div>`).join('');
    const notes = ((it && it.notes) || []).map(noteLine).join('');
    const planHtml = plan.length ? `<ul>${plan.flatMap(e => e.lines).map(l => `<li>${esc(l.replace(/^[-•*]\s*/, ''))}</li>`).join('')}</ul>` : '<p class="muted">План не записан.</p>';

    // думалка: только игроки, IGL несёт идеи сразу на сбор
    const igl = new Set(D.roster.filter(r => r.rkey === 'igl').map(r => r.nick));
    const ideas = D.ideas.filter(x => inR(x, wk)), c = new Map();
    for (const x of ideas) c.set(x.who, (c.get(x.who) || 0) + 1);
    const who = D.roster.map(r => r.nick).filter(n => !igl.has(n))
      .concat([...c.keys()].filter(n => !D.roster.some(r => r.nick === n)));
    const fate = ideaCounts(wk);
    const three = fate ? `<span class="three"><i>внесли <b>${fate.in ?? '—'}</b></i><i class="good">взяли на тест <b>${fate.test ?? '—'}</b></i><i class="crit">отклонили <b>${fate.no ?? '—'}</b></i></span>` : '';
    const dum = `<div class="card stack dum"><b>Думалка за неделю</b><span>${who.map(n => `${esc(n)} <b>${c.get(n) || 0}</b>`).join(' · ')}</span>${three}</div>`;

    const revs = D.journal.filter(e => e.kind === 'разбор' && inR(e, wk));
    const revHtml = revs.length ? `<div class="card stack"><h3>Разборы</h3>${revs.map(e => `<div class="rev"><b>${ddmm(e.date)} · ${esc(e.title)}</b>${e.lines.map(noteLine).join('')}</div>`).join('')}</div>` : '';

    const signals = [];
    const idx = trendIdx();
    for (const r of D.roster) {
      const ser = idx.map(i => agg(rowsOf(pick(weekR(i)), r.nick)));
      const fr = falling(ser.map(x => x.rating), 0.01, idx), fg = falling(ser.map(x => x.hd), 0.05, idx);
      if (fr) signals.push(`${esc(r.nick)}: рейтинг четыре недели подряд вниз, ${ddmm(fr.from)}–${ddmm(fr.to)}, ${fr.vals.map(v => v.toFixed(2)).join(' → ')}`);
      if (fg) signals.push(`${esc(r.nick)}: голова четыре недели подряд вниз, ${fg.vals.map(v => v.toFixed(1)).join(' → ')}${fg.from < HEAD_FROM ? '. ' + HX_NOTE : ''}`);
    }
    const worst = byMap(pick(cur(), false)).map(([m, l]) => { const t = tally(l); return [m, t.w + t.l ? t.w / (t.w + t.l) : null, t.w + t.l]; })
      .filter(x => x[1] != null && x[2] >= 3).sort((p, q) => p[1] - q[1])[0];
    if (worst) signals.push(`хуже всего карта ${esc(worst[0])}: ${Math.round(100 * worst[1])}% на ${mapsN(worst[2])}`);

    return section(`Итог недели ${ddmm(wk.lo)} — ${ddmm(wk.hi)}`, `
      <div class="grid two">
        <div class="card"><h3>Оценка недели <span class="muted">IGL, 1–5</span></h3>${scores ? `<div class="scores">${scores}</div>` : '<p class="muted">Итог не записан.</p>'}${notes}</div>
        <div class="card"><h3>План на следующую неделю</h3>${planHtml}</div>
      </div>
      ${dum}${revHtml}
      <div class="card stack"><h3>Сигналы из цифр <span class="muted">сам отчёт, без решений</span></h3>${signals.length ? `<ul>${signals.map(x => `<li>${x}</li>`).join('')}</ul>` : '<p class="muted">Ничего тревожного.</p>'}</div>`);
  }

  // ══ управление ══
  function initControls() {
    document.getElementById('team').textContent = D.team;
    document.getElementById('sample').hidden = !D.sample;
    const lvl = document.getElementById('f-lvl');
    const seen = new Set(D.matches.map(lvlOf));
    // лестница показывается целиком: разница между тиром 1 и тиром 3 важнее пустого чипа.
    // «No» и «OPEN» появляются, только если на них реально играли.
    const order = D.levels.filter(x => !['No', 'OPEN'].includes(x) || seen.has(x))
      .concat(seen.has(NOLVL) ? [NOLVL] : []);
    lvl.innerHTML = '<span class="k">уровень</span><button type="button" data-v="">любой</button>'
      + order.map(k => `<button type="button" data-v="${esc(k)}"${seen.has(k) ? '' : ' class="none"'}>${esc(k)}</button>`).join('');
    const fm = document.getElementById('f-map');
    fm.innerHTML = '<option value="all">все</option>' + [...new Set(D.matches.map(m => m.map).filter(Boolean))].sort().map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
    const fp = document.getElementById('f-player');
    fp.innerHTML = '<option value="all">все</option>' + D.roster.map(r => `<option value="${esc(r.nick)}">${esc(r.nick)}</option>`).join('');
    lvl.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      const v = b.dataset.v;
      if (!v) S.lvls.clear();
      else if (S.lvls.has(v)) S.lvls.delete(v);
      else S.lvls.add(v);
      render();
    });
    fm.onchange = e => { S.map = e.target.value; render(); };
    fp.onchange = e => { S.player = e.target.value; render(); };
    document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      S[seg.dataset.key] = b.dataset.v;
      if (seg.dataset.key === 'period' && b.dataset.v === 'month') S.month = monthOf(S.week);
      render();
    }));
    const app = document.getElementById('app');
    app.addEventListener('click', e => {
      const hs = e.target && e.target.closest ? e.target.closest('[data-hside]') : null;
      if (hs) { S.hside = hs.dataset.hside; S.focus = 'hside:' + S.hside; render(); return; }
      const ha = e.target && e.target.closest ? e.target.closest('[data-hattr]') : null;
      if (ha) { S.hsel[ha.dataset.hnick] = ha.dataset.hattr; S.focus = {nick: ha.dataset.hnick, attr: ha.dataset.hattr}; render(); return; }
      const an = e.target && e.target.closest ? e.target.closest('[data-anav]') : null;
      if (an) { S.ap += Number(an.dataset.anav); S.focus = 'anav:' + an.dataset.anav; render(); return; }
      const b = e.target && e.target.closest ? e.target.closest('[data-gnav]') : null;
      if (!b) return;
      S.gp += Number(b.dataset.gnav); S.focus = b.dataset.gnav; render();
    });
    app.addEventListener('change', e => { if (e.target && e.target.id === 'gcmp') { S.gcmp = e.target.value; S.focus = 'gcmp'; render(); } });
    const stepMonth = k => { const m = shiftMonth(S.month, k), i = lastWeekOf(m); if (i >= 0) { S.month = m; S.week = i; render(); } };
    document.getElementById('wprev').onclick = () => { if (S.period === 'month') stepMonth(-1); else if (S.week > 0) { S.week--; render(); } };
    document.getElementById('wnext').onclick = () => { if (S.period === 'month') stepMonth(1); else if (S.week < W.length - 1) { S.week++; render(); } };
    // календарь: кнопка с датами открывает список месяцев с их неделями
    const cal = document.getElementById('cal'), wl = document.getElementById('wlabel');
    const closeCal = () => { cal.hidden = true; wl.setAttribute('aria-expanded', 'false'); };
    wl.onclick = () => {
      const open = cal.hidden;
      cal.hidden = !open;
      wl.setAttribute('aria-expanded', String(open));
      if (open) { cal.style.top = document.querySelector('.filters').offsetHeight + 'px'; drawCal(); }
    };
    cal.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.calM) { S.period = 'month'; S.month = b.dataset.calM; S.week = lastWeekOf(S.month); }
      else if (b.dataset.calW) { S.week = Number(b.dataset.calW); if (S.period === 'month' || S.period === 'all') S.period = 'week'; }
      closeCal();
      render();
    });
    cal.addEventListener('keydown', e => { if (e.key === 'Escape') { closeCal(); wl.focus(); } });
  }
  function drawCal() {
    const months = [...new Set(W.map((_, i) => monthOf(i)))].reverse();
    const nIn = i => D.matches.filter(m => m.date >= W[i].lo && m.date <= W[i].hi).length;
    document.getElementById('cal').innerHTML = months.map(m => {
      const weeks = W.map((w, i) => [w, i]).filter(([, i]) => monthOf(i) === m);
      return `<div class="mo"><button type="button" class="mname" data-cal-m="${m}" aria-pressed="${S.period === 'month' && S.month === m}">${monthName(m)}</button>`
        + weeks.map(([w, i]) => `<button type="button" data-cal-w="${i}" aria-pressed="${S.period !== 'month' && S.week === i}">${ddmm(w.lo)}–${ddmm(w.hi)}<small>${nIn(i) || ''}</small></button>`).join('')
        + '</div>';
    }).join('');
  }
  function render() {
    document.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(S[seg.dataset.key] === b.dataset.v))));
    document.querySelectorAll('#f-lvl button').forEach(b => b.setAttribute('aria-pressed',
      String(b.dataset.v ? S.lvls.has(b.dataset.v) : S.lvls.size === 0)));
    const wk = W[S.week];
    const isM = S.period === 'month';
    document.getElementById('wlabel').textContent = isM ? monthName(S.month) : `${ddmm(wk.lo)} — ${ddmm(wk.hi)}`;
    document.getElementById('wprev').disabled = isM ? lastWeekOf(shiftMonth(S.month, -1)) < 0 : S.week === 0;
    document.getElementById('wnext').disabled = isM ? lastWeekOf(shiftMonth(S.month, 1)) < 0 : S.week === W.length - 1;
    if (!document.getElementById('cal').hidden) drawCal();
    const tail = secMaps() + secMatches();
    const qa = typeof document.querySelectorAll === 'function' ? sel => [...document.querySelectorAll(sel)] : () => [];
    const opened = new Set(qa('#app details.match[open]').map(d => d.dataset.k));
    document.getElementById('app').innerHTML = S.player === 'all'
      ? secTeam() + secWeekReport() + secSchedule() + secIndividual() + secDiary() + secPlayers() + secABC() + tail
      : secTeam() + secWeekReport() + secSchedule() + secIndividual() + secDiary() + secPlayers() + secPlayer(S.player) + secABC() + tail;
    if (opened.size) qa('#app details.match').forEach(d => { if (opened.has(d.dataset.k)) d.open = true; });
    if (S.focus && typeof document.querySelector === 'function') {
      const b = typeof S.focus === 'object'
        ? [...document.querySelectorAll('[data-hattr]')].find(x => x.dataset.hnick === S.focus.nick && x.dataset.hattr === S.focus.attr)
        : S.focus === 'gcmp' ? document.getElementById('gcmp')
        : S.focus.startsWith('hside:') ? document.querySelector(`[data-hside="${S.focus.slice(6)}"]`)
        : S.focus.startsWith('anav:') ? document.querySelector(`[data-anav="${S.focus.slice(5)}"]`)
        : document.querySelector(`[data-gnav="${S.focus}"]`);
      if (b) b.focus();
    }
    S.focus = null;
  }
  if (D.empty) {
    document.getElementById('team').textContent = D.team;
    document.querySelector('.filters').hidden = true;
    document.getElementById('app').innerHTML =
      `<section class="sec"><div class="card"><h3>${esc(D.title || 'Пока пусто')}</h3>`
      + `<p class="muted">${esc(D.note || '')}</p></div></section>`;
    return;
  }
  initControls();
  render();
}

(async () => {
  const raw = JSON.parse(document.getElementById('data').textContent);
  if (!raw.locked) { start(raw); return; }
  const L = raw.locked, KEY = 'team-dashboard-pass';
  const wrap = document.getElementById('wrap'), gate = document.getElementById('gate');
  const form = document.getElementById('gate-form'), err = document.getElementById('gate-err');
  const btn = form.querySelector('button');
  document.getElementById('gate-team').textContent = L.team || 'Команда';
  wrap.hidden = true;
  const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  async function unlock(pass) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: bytes(L.salt), iterations: L.iter, hash: 'SHA-256'},
      base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes(L.iv)}, key, bytes(L.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function open(D) {
    gate.hidden = true;
    wrap.hidden = false;
    const out = document.getElementById('logout');
    out.hidden = false;
    out.onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); };
    start(D);
  }
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    try { open(await unlock(saved)); return; } catch (e) { try { localStorage.removeItem(KEY); } catch (e2) {} }
  }
  gate.hidden = false;
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    err.hidden = true;
    btn.disabled = true;
    btn.textContent = 'Проверяю…';
    const pass = document.getElementById('gate-pass').value;
    try {
      const D = await unlock(pass);
      if (document.getElementById('gate-remember').checked) { try { localStorage.setItem(KEY, pass); } catch (e) {} }
      open(D);
    } catch (e) {
      err.hidden = false;
      btn.disabled = false;
      btn.textContent = 'Открыть';
    }
  });
})();
</script>

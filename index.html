<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>[hidden]{display:none!important}</style>
<title>Неделя WeClear NXT</title>
<meta name="description" content="Недельный дашборд команды: праки, офки, игроки, карты, итог и план">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Fira+Sans+Condensed:wght@400;500;600&family=Fira+Mono:wght@400;500&display=swap">

</head>
<body>

<style>
:root{
  --ground:#0d0d0d;--surface:#1a1a19;--line:#2c2c2a;--ring:#383835;
  --ink:#ffffff;--ink-2:#c3c2b7;--muted:#898781;
  --ct:#3987e5;--t:#d95926;--good:#0ca30c;--crit:#d03b3b;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --ui:"Fira Sans Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"Fira Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}   /* иначе .gate со своим display перебивает атрибут */
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font:15px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 14px 56px}
.brand{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;padding:20px 0 10px}
.brand .team{font:600 22px/1 var(--display);letter-spacing:.03em}
.brand .sub{color:var(--muted);font-size:14px}
.sample{margin:0 0 12px;padding:8px 12px;border:1px dashed var(--ring);border-radius:10px;color:var(--ink-2);font-size:13px}
.filters{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;overflow-x:auto;margin:0 -14px;padding:10px 14px;background:rgba(13,13,13,.96);border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.week,.seg,.sel{flex:none;display:flex;align-items:center}
.week{gap:4px}
.week button,.seg button,.sel select{height:36px;font:500 14px var(--ui);color:var(--ink-2);background:var(--surface);border:1px solid var(--ring)}
.week button{width:36px;border-radius:8px;cursor:pointer}
.week button:disabled{opacity:.35;cursor:default}
#wlabel{min-width:106px;text-align:center;font:500 14px var(--mono);color:var(--ink)}
.seg button{padding:0 12px;cursor:pointer}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button+button{margin-left:-1px}
.seg button[aria-pressed="true"]{position:relative;background:var(--ct);border-color:var(--ct);color:#fff}
.sel{gap:6px;font-size:12px;color:var(--muted)}
.sel select{border-radius:8px;padding:0 6px;color:var(--ink)}
button:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sec{margin-top:32px}
.sec>h2{margin:0 0 12px;font:600 13px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lead{margin:-4px 0 12px;color:var(--muted);font-size:13px;max-width:72ch}
.subh{margin:20px 0 6px;font:600 15px var(--ui)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h3{margin:0 0 10px;font:600 15px var(--ui);display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.card h3 .muted{font-weight:400;font-size:13px}
.card p{margin:4px 0;color:var(--ink-2)}
.card p span{color:var(--muted)}
.card ul{margin:0;padding-left:18px;color:var(--ink-2)}
.card .muted,.card p.muted{color:var(--muted)}
.small{font-size:12px}
.grid{display:grid;gap:10px}
.stack{margin-top:10px}
.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.k{font:600 11px/1.2 var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tile .val{font:500 26px/1.15 var(--mono);margin:6px 0 4px}
.tile .note{font-size:13px;color:var(--muted)}
.split{display:flex;gap:2px;height:6px;margin-top:10px}
.split i{display:block;border-radius:3px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th{padding:6px 8px;border-bottom:1px solid var(--ring);font:600 12px var(--ui);color:var(--muted);text-align:left;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.total td{border-top:1px solid var(--ring);font-weight:600}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td sub{margin-left:3px;font-size:10px;color:var(--muted);vertical-align:baseline}
td.map{font-weight:600}
.good{color:var(--good)}.crit{color:var(--crit)}.muted{color:var(--muted)}
.dl{font:500 12px var(--mono);white-space:nowrap}
.dl.up{color:var(--good)}.dl.down{color:var(--crit)}.dl.zero,.dl.none{color:var(--muted)}
.legend{display:inline-flex;flex-wrap:wrap;gap:4px 12px;font:400 12px var(--ui);color:var(--ink-2)}
.sw{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px;vertical-align:-1px}
.bars{display:grid;gap:3px;min-width:130px}
.barrow{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--ink-2)}
.bar{display:block;height:7px;border-radius:0 4px 4px 0;background:var(--t)}
.bar.ct{background:var(--ct)}
.chart{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--muted);font:10px var(--mono)}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .end{stroke:var(--surface);stroke-width:2}
.chart .endlab{fill:var(--ink);font:500 11px var(--mono)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gchart{display:grid;gap:10px}
.ghead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}
.gwho{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap}
.gwho b{font:600 19px var(--ui)}
.gbody{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;align-items:center;gap:6px}
.gnav{height:56px;border-radius:8px;border:1px solid var(--ring);background:var(--ground);color:var(--ink-2);font:500 14px var(--ui);cursor:pointer}
.gnav:hover{color:var(--ink);border-color:var(--muted)}
.gnav:focus-visible{outline:2px solid #fff;outline-offset:2px}
.gempty{text-align:center;padding:40px 0}
.gsvg .base{stroke:var(--ring);stroke-width:1}
.gsvg .bv{fill:var(--ink);font:500 10px var(--mono);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.gscroll{min-width:0}
.gsvg .cat{fill:var(--ink-2);font:500 12px var(--ui)}
.gsvg .catn{fill:var(--muted);font:10px var(--mono)}
.gsvg .bvbg{fill:var(--surface)}
.gsvg .own{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4;opacity:.75}
.gsvg .ownlab{fill:var(--ink-2);font:500 10px var(--mono);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.gsvg .ghost{fill:rgba(255,255,255,.06);stroke:#fff;stroke-width:1.5;stroke-dasharray:3 3}
.glegend small{font:11px var(--mono);color:var(--muted)}
.sw.ownsw{height:0;border-top:2px dashed var(--ink);border-radius:0;vertical-align:3px;width:14px}
.sw.ghostsw{background:rgba(255,255,255,.06);border:1.5px dashed #fff}
.task p{margin:6px 0 0;color:var(--ink-2);font-size:14px;max-width:95ch}
.itab th.dcol{min-width:124px;color:var(--ink-2);vertical-align:bottom}
.itab th.dcol b{color:var(--ink)}
.itab th.dcol small{display:block;font:400 11px var(--ui);color:var(--muted);text-transform:none}
.itab .off{background:rgba(255,255,255,.03)}
.itab th.nick{color:var(--ink);font-size:14px;vertical-align:top;padding-top:10px}
.itab td.icell{vertical-align:top;white-space:normal;min-width:124px;padding:8px 6px}
.itab .none{color:var(--ring)}
.ti{display:flex;gap:6px;align-items:baseline;font-size:12.5px;line-height:1.3;color:var(--ink-2)}
.ti+.ti{margin-top:5px}
.tt{flex:none;font:600 10px/1.4 var(--ui);letter-spacing:.04em;text-transform:uppercase;padding:1px 5px;border-radius:4px}
.tt.tw{background:rgba(88,184,216,.16);color:#7fcbe3}
.tt.tm{background:rgba(63,174,90,.16);color:#7fd18f}
.tt.tc{background:rgba(169,139,232,.18);color:#c2acf0}
.ileg{margin-top:10px}
.istrip{display:inline-flex;gap:3px;vertical-align:-1px;margin-right:8px}
.istrip i{display:block;width:10px;height:10px;border-radius:2px;background:var(--line)}
.istrip i.on{background:#3fae5a}
.istrip i.off:not(.on){background:none;border:1px dashed var(--ring)}
.istrip i.hole{box-shadow:inset 0 0 0 2px var(--crit)}
.istrip i.hole:not(.on){background:rgba(208,59,59,.35);border:none}
.nil{font-size:12.5px;color:var(--muted)}
.ihole{margin-top:5px;font:600 11.5px/1.3 var(--ui);color:#ff9a9a}
.ti+.ihole,.nil+.ihole{margin-top:6px}
.irule{margin:10px 0 0;max-width:65ch;font-size:13px;color:var(--ink-2)}
.irule b{color:#ff9a9a;font-weight:600}
.itab td.num small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.itab td.num.crit b{color:#ff9a9a}
.ihead{margin:0 0 6px;font-size:13px}
.ilist{display:grid}
.iday{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.iday:first-child{border-top:none}
.iday.off{opacity:.75}
.iday .dd small{display:block;color:var(--muted);font-size:11px}
.hside{display:inline-flex;margin:0 0 10px}
.hside button{height:32px;padding:0 14px;font:500 13px var(--ui);color:var(--ink-2);background:var(--surface);border:1px solid var(--ring);cursor:pointer}
.hside button:first-child{border-radius:8px 0 0 8px}.hside button:last-child{border-radius:0 8px 8px 0}.hside button+button{margin-left:-1px}
.hside button[aria-pressed="true"]{background:var(--ct);border-color:var(--ct);color:#fff}
.hside button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hin{grid-column:1/-1;display:grid;gap:8px;padding-top:10px;margin-top:2px;border-top:1px solid var(--line)}
.hin>.k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.hin>.k .muted{text-transform:none;letter-spacing:0}
.hsplit{display:grid;gap:12px 24px;align-items:start}
@media (min-width:860px){.hsplit{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.hmain{display:grid;gap:2px}
button.hrow{width:100%;margin:0;padding:5px 8px;border:1px solid transparent;border-radius:8px;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
button.hrow:hover{background:rgba(255,255,255,.035)}
button.hrow.on{background:rgba(255,255,255,.06);border-color:var(--ring)}
button.hrow:focus-visible{outline:2px solid #fff;outline-offset:1px}
.hdet{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
.hdet .hbt{margin-bottom:6px}
.hcard{display:grid;gap:10px;align-content:start}
.hhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.hhead b{font:600 18px var(--ui)}
.hrt{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--line)}
.hrt b{font:500 22px var(--mono)}
.hmain{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:86px minmax(0,1fr) 62px;align-items:center;gap:10px;font-size:14px}
.hrow.on .hn{color:var(--ink);font-weight:600}
.hn{color:var(--ink-2)}
.hv{text-align:right;font:12px var(--mono);color:var(--muted)}
.hv b{font:500 15px var(--mono);color:var(--ink)}
.hb{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.hb.sm{height:5px}
.hb i{display:block;height:100%;border-radius:4px}
.hb i.lo{background:#c9504a}.hb i.md{background:#d9a23a}.hb i.hi{background:#3fae5a}.hb i.none{background:none}
.hblk{margin-top:12px}
.hbt{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;font-size:14px}
.hbt .hv{margin-left:auto}
.hsub{display:grid;grid-template-columns:minmax(0,1fr) 52px 70px;align-items:center;gap:8px;padding:3px 0;font-size:12.5px;color:var(--muted)}
.hsub.w{color:var(--ink-2);font-weight:500}
.hsub .hx{text-align:right;font:12px var(--mono);color:var(--ink)}
.hsub .hl{min-width:0}
@media (max-width:760px){.gsvg{min-width:600px}.gsvg .bv{font-size:12px}.gsvg .cat{font-size:13px}.gsvg .catn,.gsvg .ownlab{font-size:11px}.gsvg .tick{font-size:11px}}
@media (max-width:600px){.gbody{grid-template-columns:28px minmax(0,1fr) 28px}.ghead>.sel{flex-basis:100%}.gwho{flex-wrap:nowrap;min-width:0}.gwho .role{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
.empty{color:var(--muted);margin:0}
.topic .th{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.topic .th b{font-size:16px}
.cnt{font:500 13px var(--mono);color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.chip{border:1px solid var(--ring);border-radius:999px;padding:1px 9px;font-size:13px;color:var(--ink-2)}
.chip b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.card ul.goals{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:14px}
.goals .d{font:12px var(--mono);color:var(--muted);margin-right:8px}
.pcard{display:grid;gap:12px}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.phead h3{margin:0;font:600 21px var(--ui)}
.role{font-size:13px;color:var(--muted)}
.flag{padding:1px 9px;border:1px solid rgba(208,59,59,.55);border-radius:999px;font-size:12px;color:#ff8f8f}
.pbody{display:grid;gap:14px}
@media (min-width:860px){.pbody{grid-template-columns:140px minmax(0,1.5fr) minmax(0,1fr)}}
.rating .big{font:500 34px/1.1 var(--mono);margin:4px 0}
.tg{margin-top:6px;font-size:13px}
.kvs{display:grid;gap:12px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kv.grades{padding-top:10px;border-top:1px solid var(--line)}
.kv .hnote{grid-column:span 2;align-self:center;margin:0;font-size:12px;color:var(--muted)}
.kv .v{font:500 19px/1.2 var(--mono);margin:2px 0}
.kv .v.sm{font-size:17px}
.train{margin:0;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.train b{margin-right:8px;font:600 11px var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mx th.c{text-align:center}
.mx th.c small{display:block;font:400 11px var(--mono);color:var(--muted)}
.mx th.nick{color:var(--ink);font-size:14px}
.mx td.cell{padding:3px;border:none}
.mx .c{min-width:66px;padding:6px 4px;border-radius:8px;text-align:center}
.mx .c b{display:block;font:500 16px/1.2 var(--mono)}
.mx .c span{font:11px var(--mono);color:rgba(255,255,255,.85)}
.mx .c.few{border:1px solid var(--ring);color:var(--muted)}
.mx .c.few span{color:var(--muted)}
.sagp{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:9px 0}
.sagp+.sagp{border-top:1px solid var(--line)}
.sagp .nick{font-weight:600}
.sagl{display:grid;gap:5px}
.sagr{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;font-size:14px}
.sagr .m{color:var(--crit);font-weight:600}
.sagr .t{color:var(--ink-2)}
.sagr .n{font:12px var(--mono);color:var(--muted)}
.gtab th:first-child{color:var(--ink);font-size:15px}
.gtab td:first-child{color:var(--ink-2)}
.gtab .own{border-left:1px solid var(--ring)}
.dum{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:10px;font-size:14px}
.dum>b{font:600 11px var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dum span b{font-family:var(--mono);font-weight:500}
.day{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px}
.dd b{display:block;font:500 16px var(--mono)}
.dd span{color:var(--muted);font-size:13px}
.rev{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.rev>b{display:block;margin-bottom:4px;font-size:14px}
.scores{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:8px}
.score .big{font:500 32px/1.1 var(--mono)}
@media (max-width:540px){.sagp{grid-template-columns:1fr;gap:4px}.sagr{grid-template-columns:84px minmax(0,1fr) auto}.minis{grid-template-columns:1fr}}
.linkbtn{margin-left:auto;background:none;border:0;padding:0;color:var(--muted);font:500 13px var(--ui);text-decoration:underline;cursor:pointer}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ground)}
.gate form{width:min(360px,100%);display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.gate h1{margin:0;font:600 20px/1.2 var(--display);color:var(--ink)}
.gate p{margin:0;color:var(--muted);font-size:14px}
.gate input[type=password]{height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--ring);background:var(--ground);color:var(--ink);font:500 16px var(--ui)}
.gate label{display:flex;gap:8px;align-items:center;color:var(--ink-2);font-size:14px}
.gate button{height:44px;border:0;border-radius:8px;background:var(--ct);color:#fff;font:600 15px var(--ui);cursor:pointer}
.gate button:disabled{opacity:.6;cursor:default}
.gate .err{color:#ff8f8f}

/* уровни соперника: выбирается несколько */
.lvls{display:flex;align-items:center;gap:4px;flex-wrap:wrap;max-width:560px}
.lvls .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.lvls button{border:1px solid var(--ring);background:transparent;color:var(--ink-2);border-radius:999px;
  padding:2px 10px;font:13px/1.3 var(--ui);cursor:pointer}
.lvls button[aria-pressed="true"]{background:var(--ct);border-color:var(--ct);color:#fff}
.spots{margin:0;padding:8px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.spots b{color:var(--muted);font:500 11px/1.4 var(--ui);text-transform:uppercase;letter-spacing:.06em}
.spots .chips{display:flex;gap:6px;flex-wrap:wrap}
small.pos{display:block;color:var(--muted);font-size:11px}
.duel{grid-column:1/-1;padding-top:10px;margin-top:2px;border-top:1px solid var(--line)}
.duel .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.drow{display:grid;grid-template-columns:120px 62px minmax(0,1fr);align-items:baseline;gap:8px;font-size:13px}
.drow span{color:var(--ink-2)}
.drow b{font:500 17px/1.2 var(--mono)}
.drow b.good{color:#8fe08f} .drow b.crit{color:#ff9a9a} .drow b.warn{color:#f0c674}
.drow i{color:var(--muted);font-style:normal;font-size:12px}
.norm .bar2{display:block;margin-top:2px;color:var(--muted)}
.norm{margin-top:6px;font-size:12px;color:var(--ink-2)}
.norm b{font-family:var(--mono);font-weight:500}
.norm b.good{color:#8fe08f} .norm b.crit{color:#ff9a9a}
.sd em{display:block;font-style:normal;font-size:11px;margin-top:1px}
.sd em.good{color:#8fe08f} .sd em.crit{color:#ff9a9a} .sd em.muted{color:var(--muted)}
/* два графика в ряд на всю ширину карточки */
.prow{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:14px;
  padding-top:12px;margin-top:2px;border-top:1px solid var(--line)}
.prow .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.prow .chart{width:100%;height:auto}
.lvls button.none{opacity:.45}
@media (max-width:720px){.prow{grid-template-columns:1fr}}
line.goal{stroke:var(--good);stroke-dasharray:4 4;stroke-width:1}
text.tick.goal{fill:var(--good)}
/* стороны */
.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sd{border:1px solid var(--ring);border-radius:8px;padding:6px 8px}
.sd span{display:block;font-size:11px;letter-spacing:.06em;color:var(--muted)}
.sd b{font:500 19px/1.2 var(--mono)}
.sd small{display:block;color:var(--muted);font-size:11px}
.sd.t{border-color:rgba(217,89,38,.5)} .sd.ct{border-color:rgba(57,135,229,.5)}
.sd2{display:flex;gap:6px;justify-content:center;margin-top:2px;font:400 10px/1.2 var(--mono)}
.sd2 .t{color:#f0a184;font-style:normal} .sd2 .ct{color:#9dc3f2;font-style:normal}
.train .cnt{color:var(--ink)}
/* думалка тремя числами */
.dum .three{display:flex;gap:10px;flex-wrap:wrap}
.dum .three i{font-style:normal;color:var(--ink-2)}
.dum .three i.good{color:#8fe08f} .dum .three i.crit{color:#ff9a9a}
/* список матчей */
.matches{padding:0}
.match{border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:0}
.match summary{display:grid;grid-template-columns:52px 96px minmax(0,1fr) 92px 64px 96px;gap:8px;align-items:center;
  padding:9px 14px;cursor:pointer;list-style:none}
.match summary::-webkit-details-marker{display:none}
.match summary:hover{background:rgba(255,255,255,.03)}
.match .d{color:var(--muted);font-family:var(--mono);font-size:13px}
.match .mp{font-weight:600}
.match .vs{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .lv{color:var(--muted);font-size:12px}
.match .sc{font-family:var(--mono);font-weight:500}
.match .sc.win{color:#8fe08f} .match .sc.loss{color:#ff9a9a} .match .sc.draw{color:var(--ink-2)}
.match .tp{color:var(--muted);font-size:12px;text-align:right}
.match .tp a{color:var(--ct)}
.mdet{padding:2px 14px 14px}
.mmeta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.mmeta span{color:var(--ink-2);font-size:13px}
.mmeta i{display:block;color:var(--muted);font-size:11px;font-style:normal;text-transform:uppercase;letter-spacing:.06em}
table.mtab td,table.mtab th{padding:3px 8px}
/* списки в разделе про игрока */
ul.tl{margin:0;padding:0;list-style:none}
ul.tl li{padding:3px 0;border-bottom:1px solid var(--line);font-size:14px}
ul.tl li:last-child{border-bottom:0}
ul.tl .d{display:inline-block;min-width:46px;color:var(--muted);font-family:var(--mono);font-size:12px}
@media (max-width:720px){
  .match summary{grid-template-columns:46px 1fr 56px;grid-template-areas:"d mp sc" "vs vs lv" "tp tp tp";row-gap:2px}
  .match .d{grid-area:d}.match .mp{grid-area:mp}.match .sc{grid-area:sc;text-align:right}
  .match .vs{grid-area:vs}.match .lv{grid-area:lv;text-align:right}.match .tp{grid-area:tp;text-align:left}
  .sides{grid-template-columns:1fr}
}
</style>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>[hidden]{display:none!important}</style>
<title>Неделя WeClear NXT</title>
<meta name="description" content="Недельный дашборд команды: праки, офки, игроки, карты, итог и план">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Fira+Sans+Condensed:wght@400;500;600&family=Fira+Mono:wght@400;500&display=swap">

</head>
<body>

<style>
:root{
  --ground:#0d0d0d;--surface:#1a1a19;--line:#2c2c2a;--ring:#383835;
  --ink:#ffffff;--ink-2:#c3c2b7;--muted:#898781;
  --ct:#3987e5;--t:#d95926;--good:#0ca30c;--crit:#d03b3b;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --ui:"Fira Sans Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"Fira Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}   /* иначе .gate со своим display перебивает атрибут */
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font:15px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 14px 56px}
.brand{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;padding:20px 0 10px}
.brand .team{font:600 22px/1 var(--display);letter-spacing:.03em}
.brand .sub{color:var(--muted);font-size:14px}
.sample{margin:0 0 12px;padding:8px 12px;border:1px dashed var(--ring);border-radius:10px;color:var(--ink-2);font-size:13px}
.filters{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;overflow-x:auto;margin:0 -14px;padding:10px 14px;background:rgba(13,13,13,.96);border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.week,.seg,.sel{flex:none;display:flex;align-items:center}
.week{gap:4px}
.week button,.seg button,.sel select{height:36px;font:500 14px var(--ui);color:var(--ink-2);background:var(--surface);border:1px solid var(--ring)}
.week button{width:36px;border-radius:8px;cursor:pointer}
.week button:disabled{opacity:.35;cursor:default}
#wlabel{min-width:106px;text-align:center;font:500 14px var(--mono);color:var(--ink)}
.seg button{padding:0 12px;cursor:pointer}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button+button{margin-left:-1px}
.seg button[aria-pressed="true"]{position:relative;background:var(--ct);border-color:var(--ct);color:#fff}
.sel{gap:6px;font-size:12px;color:var(--muted)}
.sel select{border-radius:8px;padding:0 6px;color:var(--ink)}
button:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sec{margin-top:32px}
.sec>h2{margin:0 0 12px;font:600 13px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lead{margin:-4px 0 12px;color:var(--muted);font-size:13px;max-width:72ch}
.subh{margin:20px 0 6px;font:600 15px var(--ui)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h3{margin:0 0 10px;font:600 15px var(--ui);display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.card h3 .muted{font-weight:400;font-size:13px}
.card p{margin:4px 0;color:var(--ink-2)}
.card p span{color:var(--muted)}
.card ul{margin:0;padding-left:18px;color:var(--ink-2)}
.card .muted,.card p.muted{color:var(--muted)}
.small{font-size:12px}
.grid{display:grid;gap:10px}
.stack{margin-top:10px}
.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.k{font:600 11px/1.2 var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tile .val{font:500 26px/1.15 var(--mono);margin:6px 0 4px}
.tile .note{font-size:13px;color:var(--muted)}
.split{display:flex;gap:2px;height:6px;margin-top:10px}
.split i{display:block;border-radius:3px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th{padding:6px 8px;border-bottom:1px solid var(--ring);font:600 12px var(--ui);color:var(--muted);text-align:left;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.total td{border-top:1px solid var(--ring);font-weight:600}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td sub{margin-left:3px;font-size:10px;color:var(--muted);vertical-align:baseline}
td.map{font-weight:600}
.good{color:var(--good)}.crit{color:var(--crit)}.muted{color:var(--muted)}
.dl{font:500 12px var(--mono);white-space:nowrap}
.dl.up{color:var(--good)}.dl.down{color:var(--crit)}.dl.zero,.dl.none{color:var(--muted)}
.legend{display:inline-flex;flex-wrap:wrap;gap:4px 12px;font:400 12px var(--ui);color:var(--ink-2)}
.sw{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px;vertical-align:-1px}
.bars{display:grid;gap:3px;min-width:130px}
.barrow{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--ink-2)}
.bar{display:block;height:7px;border-radius:0 4px 4px 0;background:var(--t)}
.bar.ct{background:var(--ct)}
.chart{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--muted);font:10px var(--mono)}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .end{stroke:var(--surface);stroke-width:2}
.chart .endlab{fill:var(--ink);font:500 11px var(--mono)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gchart{display:grid;gap:10px}
.ghead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}
.gwho{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap}
.gwho b{font:600 19px var(--ui)}
.gbody{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;align-items:center;gap:6px}
.gnav{height:56px;border-radius:8px;border:1px solid var(--ring);background:var(--ground);color:var(--ink-2);font:500 14px var(--ui);cursor:pointer}
.gnav:hover{color:var(--ink);border-color:var(--muted)}
.gnav:focus-visible{outline:2px solid #fff;outline-offset:2px}
.gempty{text-align:center;padding:40px 0}
.gsvg .base{stroke:var(--ring);stroke-width:1}
.gsvg .bv{fill:var(--ink);font:500 10px var(--mono);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.gscroll{min-width:0}
.gsvg .cat{fill:var(--ink-2);font:500 12px var(--ui)}
.gsvg .catn{fill:var(--muted);font:10px var(--mono)}
.gsvg .bvbg{fill:var(--surface)}
.gsvg .own{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4;opacity:.75}
.gsvg .ownlab{fill:var(--ink-2);font:500 10px var(--mono);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.gsvg .ghost{fill:rgba(255,255,255,.06);stroke:#fff;stroke-width:1.5;stroke-dasharray:3 3}
.glegend small{font:11px var(--mono);color:var(--muted)}
.sw.ownsw{height:0;border-top:2px dashed var(--ink);border-radius:0;vertical-align:3px;width:14px}
.sw.ghostsw{background:rgba(255,255,255,.06);border:1.5px dashed #fff}
.task p{margin:6px 0 0;color:var(--ink-2);font-size:14px;max-width:95ch}
.itab th.dcol{min-width:124px;color:var(--ink-2);vertical-align:bottom}
.itab th.dcol b{color:var(--ink)}
.itab th.dcol small{display:block;font:400 11px var(--ui);color:var(--muted);text-transform:none}
.itab .off{background:rgba(255,255,255,.03)}
.itab th.nick{color:var(--ink);font-size:14px;vertical-align:top;padding-top:10px}
.itab td.icell{vertical-align:top;white-space:normal;min-width:124px;padding:8px 6px}
.itab .none{color:var(--ring)}
.ti{display:flex;gap:6px;align-items:baseline;font-size:12.5px;line-height:1.3;color:var(--ink-2)}
.ti+.ti{margin-top:5px}
.tt{flex:none;font:600 10px/1.4 var(--ui);letter-spacing:.04em;text-transform:uppercase;padding:1px 5px;border-radius:4px}
.tt.tw{background:rgba(88,184,216,.16);color:#7fcbe3}
.tt.tm{background:rgba(63,174,90,.16);color:#7fd18f}
.tt.tc{background:rgba(169,139,232,.18);color:#c2acf0}
.ileg{margin-top:10px}
.istrip{display:inline-flex;gap:3px;vertical-align:-1px;margin-right:8px}
.istrip i{display:block;width:10px;height:10px;border-radius:2px;background:var(--line)}
.istrip i.on{background:#3fae5a}
.istrip i.off:not(.on){background:none;border:1px dashed var(--ring)}
.istrip i.hole{box-shadow:inset 0 0 0 2px var(--crit)}
.istrip i.hole:not(.on){background:rgba(208,59,59,.35);border:none}
.nil{font-size:12.5px;color:var(--muted)}
.ihole{margin-top:5px;font:600 11.5px/1.3 var(--ui);color:#ff9a9a}
.ti+.ihole,.nil+.ihole{margin-top:6px}
.irule{margin:10px 0 0;max-width:65ch;font-size:13px;color:var(--ink-2)}
.irule b{color:#ff9a9a;font-weight:600}
.itab td.num small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.itab td.num.crit b{color:#ff9a9a}
.ihead{margin:0 0 6px;font-size:13px}
.ihead.crit{color:#ff9a9a;font-weight:600}
.ilist{display:grid}
.iday{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.iday:first-child{border-top:none}
.iday.off{opacity:.75}
.iday .dd small{display:block;color:var(--muted);font-size:11px}
.hside{display:inline-flex;margin:0 0 10px}
.hside button{height:32px;padding:0 14px;font:500 13px var(--ui);color:var(--ink-2);background:var(--surface);border:1px solid var(--ring);cursor:pointer}
.hside button:first-child{border-radius:8px 0 0 8px}.hside button:last-child{border-radius:0 8px 8px 0}.hside button+button{margin-left:-1px}
.hside button[aria-pressed="true"]{background:var(--ct);border-color:var(--ct);color:#fff}
.hside button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hin{grid-column:1/-1;display:grid;gap:8px;padding-top:10px;margin-top:2px;border-top:1px solid var(--line)}
.hin>.k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.hin>.k .muted{text-transform:none;letter-spacing:0}
.hsplit{display:grid;gap:12px 24px;align-items:start}
@media (min-width:860px){.hsplit{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.hmain{display:grid;gap:2px}
button.hrow{width:100%;margin:0;padding:5px 8px;border:1px solid transparent;border-radius:8px;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
button.hrow:hover{background:rgba(255,255,255,.035)}
button.hrow.on{background:rgba(255,255,255,.06);border-color:var(--ring)}
button.hrow:focus-visible{outline:2px solid #fff;outline-offset:1px}
.hdet{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
.hdet .hbt{margin-bottom:6px}
.hcard{display:grid;gap:10px;align-content:start}
.hhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.hhead b{font:600 18px var(--ui)}
.hrt{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--line)}
.hrt b{font:500 22px var(--mono)}
.hmain{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:86px minmax(0,1fr) 62px;align-items:center;gap:10px;font-size:14px}
.hrow.on .hn{color:var(--ink);font-weight:600}
.hn{color:var(--ink-2)}
.hv{text-align:right;font:12px var(--mono);color:var(--muted)}
.hv b{font:500 15px var(--mono);color:var(--ink)}
.hb{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.hb.sm{height:5px}
.hb i{display:block;height:100%;border-radius:4px}
.hb i.lo{background:#c9504a}.hb i.md{background:#d9a23a}.hb i.hi{background:#3fae5a}.hb i.none{background:none}
.hblk{margin-top:12px}
.hbt{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;font-size:14px}
.hbt .hv{margin-left:auto}
.hsub{display:grid;grid-template-columns:minmax(0,1fr) 52px 70px;align-items:center;gap:8px;padding:3px 0;font-size:12.5px;color:var(--muted)}
.hsub.w{color:var(--ink-2);font-weight:500}
.hsub .hx{text-align:right;font:12px var(--mono);color:var(--ink)}
.hsub .hl{min-width:0}
@media (max-width:760px){.gsvg{min-width:600px}.gsvg .bv{font-size:12px}.gsvg .cat{font-size:13px}.gsvg .catn,.gsvg .ownlab{font-size:11px}.gsvg .tick{font-size:11px}}
@media (max-width:600px){.gbody{grid-template-columns:28px minmax(0,1fr) 28px}.ghead>.sel{flex-basis:100%}.gwho{flex-wrap:nowrap;min-width:0}.gwho .role{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
.empty{color:var(--muted);margin:0}
.topic .th{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.topic .th b{font-size:16px}
.cnt{font:500 13px var(--mono);color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.chip{border:1px solid var(--ring);border-radius:999px;padding:1px 9px;font-size:13px;color:var(--ink-2)}
.chip b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.card ul.goals{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:14px}
.goals .d{font:12px var(--mono);color:var(--muted);margin-right:8px}
.pcard{display:grid;gap:12px}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.phead h3{margin:0;font:600 21px var(--ui)}
.role{font-size:13px;color:var(--muted)}
.flag{padding:1px 9px;border:1px solid rgba(208,59,59,.55);border-radius:999px;font-size:12px;color:#ff8f8f}
.pbody{display:grid;gap:14px}
@media (min-width:860px){.pbody{grid-template-columns:140px minmax(0,1.5fr) minmax(0,1fr)}}
.rating .big{font:500 34px/1.1 var(--mono);margin:4px 0}
.tg{margin-top:6px;font-size:13px}
.kvs{display:grid;gap:12px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kv.grades{padding-top:10px;border-top:1px solid var(--line)}
.kv .hnote{grid-column:span 2;align-self:center;margin:0;font-size:12px;color:var(--muted)}
.kv .v{font:500 19px/1.2 var(--mono);margin:2px 0}
.kv .v.sm{font-size:17px}
.train{margin:0;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.train b{margin-right:8px;font:600 11px var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mx th.c{text-align:center}
.mx th.c small{display:block;font:400 11px var(--mono);color:var(--muted)}
.mx th.nick{color:var(--ink);font-size:14px}
.mx td.cell{padding:3px;border:none}
.mx .c{min-width:66px;padding:6px 4px;border-radius:8px;text-align:center}
.mx .c b{display:block;font:500 16px/1.2 var(--mono)}
.mx .c span{font:11px var(--mono);color:rgba(255,255,255,.85)}
.mx .c.few{border:1px solid var(--ring);color:var(--muted)}
.mx .c.few span{color:var(--muted)}
.sagp{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:9px 0}
.sagp+.sagp{border-top:1px solid var(--line)}
.sagp .nick{font-weight:600}
.sagl{display:grid;gap:5px}
.sagr{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;font-size:14px}
.sagr .m{color:var(--crit);font-weight:600}
.sagr .t{color:var(--ink-2)}
.sagr .n{font:12px var(--mono);color:var(--muted)}
.gtab th:first-child{color:var(--ink);font-size:15px}
.gtab td:first-child{color:var(--ink-2)}
.gtab .own{border-left:1px solid var(--ring)}
.dum{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:10px;font-size:14px}
.dum>b{font:600 11px var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dum span b{font-family:var(--mono);font-weight:500}
.day{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px}
.dd b{display:block;font:500 16px var(--mono)}
.dd span{color:var(--muted);font-size:13px}
.rev{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.rev>b{display:block;margin-bottom:4px;font-size:14px}
.scores{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:8px}
.score .big{font:500 32px/1.1 var(--mono)}
@media (max-width:540px){.sagp{grid-template-columns:1fr;gap:4px}.sagr{grid-template-columns:84px minmax(0,1fr) auto}.minis{grid-template-columns:1fr}}
.linkbtn{margin-left:auto;background:none;border:0;padding:0;color:var(--muted);font:500 13px var(--ui);text-decoration:underline;cursor:pointer}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ground)}
.gate form{width:min(360px,100%);display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.gate h1{margin:0;font:600 20px/1.2 var(--display);color:var(--ink)}
.gate p{margin:0;color:var(--muted);font-size:14px}
.gate input[type=password]{height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--ring);background:var(--ground);color:var(--ink);font:500 16px var(--ui)}
.gate label{display:flex;gap:8px;align-items:center;color:var(--ink-2);font-size:14px}
.gate button{height:44px;border:0;border-radius:8px;background:var(--ct);color:#fff;font:600 15px var(--ui);cursor:pointer}
.gate button:disabled{opacity:.6;cursor:default}
.gate .err{color:#ff8f8f}

/* уровни соперника: выбирается несколько */
.lvls{display:flex;align-items:center;gap:4px;flex-wrap:wrap;max-width:560px}
.lvls .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.lvls button{border:1px solid var(--ring);background:transparent;color:var(--ink-2);border-radius:999px;
  padding:2px 10px;font:13px/1.3 var(--ui);cursor:pointer}
.lvls button[aria-pressed="true"]{background:var(--ct);border-color:var(--ct);color:#fff}
.spots{margin:0;padding:8px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.spots b{color:var(--muted);font:500 11px/1.4 var(--ui);text-transform:uppercase;letter-spacing:.06em}
.spots .chips{display:flex;gap:6px;flex-wrap:wrap}
small.pos{display:block;color:var(--muted);font-size:11px}
.duel{grid-column:1/-1;padding-top:10px;margin-top:2px;border-top:1px solid var(--line)}
.duel .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.drow{display:grid;grid-template-columns:120px 62px minmax(0,1fr);align-items:baseline;gap:8px;font-size:13px}
.drow span{color:var(--ink-2)}
.drow b{font:500 17px/1.2 var(--mono)}
.drow b.good{color:#8fe08f} .drow b.crit{color:#ff9a9a} .drow b.warn{color:#f0c674}
.drow i{color:var(--muted);font-style:normal;font-size:12px}
.norm .bar2{display:block;margin-top:2px;color:var(--muted)}
.norm{margin-top:6px;font-size:12px;color:var(--ink-2)}
.norm b{font-family:var(--mono);font-weight:500}
.norm b.good{color:#8fe08f} .norm b.crit{color:#ff9a9a}
.sd em{display:block;font-style:normal;font-size:11px;margin-top:1px}
.sd em.good{color:#8fe08f} .sd em.crit{color:#ff9a9a} .sd em.muted{color:var(--muted)}
/* два графика в ряд на всю ширину карточки */
.prow{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:14px;
  padding-top:12px;margin-top:2px;border-top:1px solid var(--line)}

.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px}

<script>
function start(D) {
  const W = D.weeks;
  /* Голова: одна оценка IGL за матч, 1–5. До 07.10 стояли четыре (Мик Мак Ком Кол), для них
     голова посчитана при сборке как среднее Мак, Ком и Кол, у таких строк стоит hx. */
  const HX_NOTE = 'До 07.10 голова считается как среднее Мак, Ком и Кол.';
  const HEAD_FROM = '2026-10-07';   // с этого дня одна оценка за матч
  const hasHx = rows => rows.some(x => x.hd != null && x.hx);
  const hdTxt = v => v == null ? '—' : Number.isInteger(v) ? String(v) : v.toFixed(1);
  const NOLVL = 'не указан';
  /* Кто где стоит: лист Map Pool. Нужно, чтобы понимать, почему на карте рейтинг такой. */
  const posOf = (nick, map, side) => ((D.positions || {})[map] || {})[side]?.[nick] || null;
  /* Таргет спота: сколько на этой позиции выдаёт средний игрок топ-50.
     Уровни между картами собраны по-разному, поэтому сравнивать честно только внутри карты. */
  const TG = new Map((D.targets || []).map(t => [`${t.map}|${t.side}|${t.p}`, t]));
  const tgOf = (nick, map, side) => TG.get(`${map}|${side}|${nick}`) || null;
  /* Норма спота на конкретной карте: цена позиции у топ-50, сдвинутая на нашу шкалу
     и с поправкой за роль. Это те же зафиксированные числа, что и общая норма, просто
     разложенные по картам. Сравниваем всегда с ними, а не со своим средним за период. */
  function mapNorm(nick, map, side) {
    const t = tgOf(nick, map, side);
    if (!t) return null;
    const rr = D.roster.find(x => x.nick === nick);
    return t.v + (D.shift ?? 0) + (rr && rr.pen != null ? rr.pen : 0);
  }
  function mapNormBoth(nick, map) {
    const c = mapNorm(nick, map, 'CT'), t = mapNorm(nick, map, 'T');
    return c == null || t == null ? (c ?? t) : (c + t) / 2;
  }
  function tgLine(nick, map) {
    const c = mapNorm(nick, map, 'CT'), t = mapNorm(nick, map, 'T');
    if (c == null && t == null) return '';
    const mark = side => { const x = tgOf(nick, map, side); return x && !x.found ? '*' : ''; };
    const one = (v, side) => v == null ? '—' : v.toFixed(2) + mark(side);
    return `норма на карте: CT ${one(c, 'CT')}, T ${one(t, 'T')}`;
  }
  const posPair = (nick, map) => {
    const t = posOf(nick, map, 'T'), c = posOf(nick, map, 'CT');
    return t || c ? `${c || '—'} за CT, ${t || '—'} за T` : null;
  };
  const lvlOf = m => (m.lvl || '').trim() || NOLVL;
  const SAG = {adr: 4, kd: 0.08, hd: 0.3};
  const S = {week: W.length - 1, month: '', period: 'week', type: 'all', lvls: new Set(), map: 'all', player: 'all', gp: 0, gpFor: 'all', ap: 0, apFor: 'all', gcmp: '', focus: null, hside: 'both', hsel: {}};
  const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const mean = a => { const v = a.filter(x => x != null && !Number.isNaN(x)); return v.length ? v.reduce((p, c) => p + c, 0) / v.length : null; };
  const fmt = (v, d = 0) => v == null ? '—' : v.toFixed(d);
  const ddmm = iso => `${iso.slice(8, 10)}.${iso.slice(5, 7)}`;
  const wday = iso => WD[new Date(iso + 'T12:00:00').getDay()];
  const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return `${n} ${a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many}`; };
  const mapsN = n => plural(n, 'карта', 'карты', 'карт');
  const section = (title, html) => `<section class="sec"><h2>${esc(title)}</h2>${html}</section>`;

  // ── периоды и выборка ──
  /* Месяц: календарный, с первого по последнее число. Неделя относится к тому месяцу,
     в котором её четверг, так неделя на стыке месяцев не попадает в оба. S.week при месяце
     стоит на последней неделе месяца, от неё считаются тренды по неделям. */
  const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  const isoD = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const monthOf = i => { const d = new Date(W[i].lo + 'T12:00:00'); d.setDate(d.getDate() + 3); return isoD(d).slice(0, 7); };
  const monthRange = m => { const [y, mo] = m.split('-').map(Number); return [`${m}-01`, isoD(new Date(y, mo, 0, 12))]; };
  const shiftMonth = (m, k) => { const [y, mo] = m.split('-').map(Number); return isoD(new Date(y, mo - 1 + k, 1, 12)).slice(0, 7); };
  const monthName = m => `${MONTHS[Number(m.slice(5, 7)) - 1]} ${m.slice(0, 4)}`;
  const lastWeekOf = m => { let k = -1; W.forEach((_, i) => { if (monthOf(i) === m) k = i; }); return k; };
  const span = () => S.period === 'week' ? 1 : S.period === '4w' ? 4 : S.period === 'month' ? 'm' : null;
  const rangeEnding = (end, n) => end < 0 ? null : n == null ? [W[0].lo, W[end].hi] : [W[Math.max(0, end - n + 1)].lo, W[end].hi];
  const cur = () => S.period === 'month' ? monthRange(S.month) : rangeEnding(S.week, span());
  const prev = () => S.period === 'month' ? monthRange(shiftMonth(S.month, -1)) : span() == null ? null : rangeEnding(S.week - span(), span());
  const weekR = i => [W[i].lo, W[i].hi];
  const trendIdx = () => { const a = []; for (let i = Math.max(0, S.week - 7); i <= S.week; i++) a.push(i); return a; };
  function pick(r, useMap = true) {
    if (!r) return [];
    return D.matches.filter(m => m.date >= r[0] && m.date <= r[1]
      && (S.type === 'all' || (S.type === 'off') === Boolean(m.tour))
      && (!S.lvls.size || S.lvls.has(lvlOf(m)))
      && (!useMap || S.map === 'all' || m.map === S.map));
  }

  // ── счёт ──
  const won = m => m.us == null || m.them == null ? null : m.us === m.them ? 'draw' : m.us > m.them;
  function tally(ms) { const t = {w: 0, l: 0, d: 0, n: ms.length}; for (const m of ms) { const x = won(m); if (x === true) t.w++; else if (x === false) t.l++; else if (x === 'draw') t.d++; } return t; }
  const wlStr = t => `${t.w}–${t.l}${t.d ? '–' + t.d : ''}`;
  function sideSplit(ms, s) {
    let pw = 0, pt = 0, cw = 0, cn = 0, fw = 0, fn = 0;
    for (const m of ms) {
      const p = m[s + 'p'], x = m[s + '2'];
      if (p !== true && p !== false) continue;
      pt++; if (p) pw++;
      if (x !== true && x !== false) continue;
      if (p) { cn++; if (x) cw++; } else { fn++; if (x) fw++; }
    }
    return [[pw, pt], [cw, cn], [fw, fn]];
  }
  function byMap(ms) { const o = new Map(); for (const m of ms) { if (!m.map) continue; if (!o.has(m.map)) o.set(m.map, []); o.get(m.map).push(m); } return [...o.entries()].sort((a, b) => b[1].length - a[1].length); }
  function rowsOf(ms, nick) { const out = []; for (const m of ms) for (const p of m.players) if (p.p === nick) out.push(Object.assign({rounds: (m.us ?? 0) + (m.them ?? 0), map: m.map, date: m.date}, p)); return out; }
  function agg(rows) {
    const ok = rows.filter(x => x.k != null && x.d != null && x.rounds);
    const R = ok.reduce((s, x) => s + x.rounds, 0);
    const K = ok.reduce((s, x) => s + x.k, 0), De = ok.reduce((s, x) => s + x.d, 0), A = ok.reduce((s, x) => s + (x.a || 0), 0);
    const adrR = ok.reduce((s, x) => s + (x.adr || 0) * x.rounds, 0);
    let rating = null, src = null;
    const real = ok.filter(x => x.r != null);                 // рейтинг матча с праккома
    if (real.length && real.length === ok.length) {
      const rr = real.reduce((s, x) => s + x.r * x.rounds, 0);
      rating = rr / R; src = 'пракком';
    } else if (R) {
      const kpr = K / R, dpr = De / R, apr = A / R, adr = adrR / R;
      rating = 0.0073 * D.kast + 0.3591 * kpr - 0.5329 * dpr + 0.2372 * (2.13 * kpr + 0.42 * apr - 0.41) + 0.0032 * adr + 0.1587;
      src = 'формула';
    }
    const hds = rows.map(x => x.hd).filter(x => x != null);
    const ek = rows.reduce((s2, x) => s2 + (x.ek || 0), 0), ed = rows.reduce((s2, x) => s2 + (x.ed || 0), 0);
    return {n: rows.length, rating, src, ek, ed, duels: ek + ed,
            win: ek + ed ? 100 * ek / (ek + ed) : null,
            adr: mean(rows.map(x => x.adr)), kd: De ? K / De : null,
            hs: mean(rows.map(x => x.hs)), ud: mean(rows.map(x => x.ud)),
            hd: mean(hds), hn: hds.length, hx: hasHx(rows),
            ct: sideAgg(rows, 'ct'), t: sideAgg(rows, 't')};
  }
  function sideAgg(rows, side) {
    /* Стороны приходят с праккома: в таблице их нет, поэтому где нет — там прочерк. */
    const ok = rows.map(x => x[side]).filter(x => x && x.rounds);
    if (!ok.length) return null;
    const R = ok.reduce((s, x) => s + x.rounds, 0);
    const K = ok.reduce((s, x) => s + x.k, 0), De = ok.reduce((s, x) => s + x.d, 0);
    return {rating: ok.reduce((s, x) => s + x.rating * x.rounds, 0) / R,
            adr: ok.reduce((s, x) => s + x.adr * x.rounds, 0) / R,
            kd: De ? K / De : null, rounds: R, n: ok.length};
  }
  function teamGrade(ms) { const v = []; for (const m of ms) for (const p of m.players) if (p.hd != null) v.push(p.hd); return mean(v); }
  function falling(vals, eps, idx) {
    /* Четыре недели подряд и три шага вниз, каждый больше eps. Неделя без игр рвёт ряд. */
    const v = vals.slice(-4);
    if (!(v.length === 4 && v.every(x => x != null) && v[0] - v[1] > eps && v[1] - v[2] > eps && v[2] - v[3] > eps)) return null;
    const i = (idx || []).slice(-4);
    return {vals: v, from: i.length ? W[i[0]].lo : null, to: i.length ? W[i[3]].hi : null};
  }

  // ── вид ──
  function delta(now, was, d = 0) {
    if (now == null || was == null) return '<span class="dl none">—</span>';
    const r = Number((now - was).toFixed(d));
    if (r === 0) return '<span class="dl zero">• 0</span>';
    return `<span class="dl ${r > 0 ? 'up' : 'down'}">${r > 0 ? '▲' : '▼'} ${Math.abs(r).toFixed(d)}</span>`;
  }
  function pctTd(w, n) {
    if (!n) return '<td class="num muted">—</td>';
    const v = 100 * w / n, cls = n < 3 ? 'muted' : v >= 55 ? 'good' : v <= 45 ? 'crit' : '';
    return `<td class="num ${cls}">${Math.round(v)}%<sub>${n}</sub></td>`;
  }
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const LO = hex('#e66767'), MID = hex('#383835'), HI = hex('#3987e5');
  function tint(t) { t = Math.max(-1, Math.min(1, t)); const to = t < 0 ? LO : HI, k = Math.abs(t); return `rgb(${MID.map((x, i) => Math.round(x + (to[i] - x) * k)).join(',')})`; }
  function line(vals, labels, {min, max, dec = 0, suf = '', w = 300, h = 118, color = 'var(--ct)', goal = null} = {}) {
    const k = w / 300, pl = 32 * k, pr = 14 * k, pt = 16 * k, pb = 22 * k;
    const real = vals.map((v, i) => [i, v]).filter(p => p[1] != null);
    if (!real.length) return '<p class="empty">нет данных</p>';
    let lo = min ?? Math.min(...real.map(p => p[1]).concat(goal == null ? [] : [goal]));
    let hi = max ?? Math.max(...real.map(p => p[1]).concat(goal == null ? [] : [goal]));
    if (hi - lo < 1e-9) { lo -= 0.5; hi += 0.5; }
    const X = i => pl + (w - pl - pr) * (vals.length < 2 ? 0.5 : i / (vals.length - 1));
    const Y = v => pt + (h - pt - pb) * (1 - (v - lo) / (hi - lo));
    let out = '';
    for (const t of [lo, (lo + hi) / 2, hi]) out += `<line class="gl" x1="${pl}" x2="${w - pr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text class="tick" x="${pl - 5}" y="${(Y(t) + 3.5).toFixed(1)}" text-anchor="end">${t.toFixed(dec)}${suf}</text>`;
    let d = '', pen = false;
    vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)} `; pen = true; });
    if (goal != null && goal >= lo && goal <= hi) out += `<line class="goal" x1="${pl}" x2="${w - pr}" y1="${Y(goal).toFixed(1)}" y2="${Y(goal).toFixed(1)}"/><text class="tick goal" x="${w - pr}" y="${(Y(goal) - 4).toFixed(1)}" text-anchor="end">цель ${goal.toFixed(dec)}</text>`;
    out += `<path class="ln" d="${d}" style="stroke:${color};stroke-width:${(2 * Math.max(1, k)).toFixed(1)}"/>`;
    const last = real[real.length - 1][0];
    for (const [i, v] of real) out += `<circle class="${i === last ? 'end' : ''}" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${((i === last ? 4.5 : 2.5) * Math.max(1, k)).toFixed(1)}" style="fill:${color}"><title>${ddmm(labels[i])} — ${v.toFixed(dec)}${suf}</title></circle>`;
    out += `<text class="endlab" x="${Math.min(X(last), w - pr - 10 * k).toFixed(1)}" y="${(Y(vals[last]) - 9 * k).toFixed(1)}" text-anchor="middle" style="font-size:${(11 * Math.max(1, k)).toFixed(1)}px">${vals[last].toFixed(dec)}${suf}</text>`;
    out += `<text class="tick" x="${pl}" y="${h - 5 * k}">${ddmm(labels[0])}</text><text class="tick" x="${w - pr}" y="${h - 5 * k}" text-anchor="end">${ddmm(labels[labels.length - 1])}</text>`;
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${out}</svg>`;
  }
  const noteLine = l => { const i = l.indexOf(':'); return i > 0 && i <= 16 ? `<p><span>${esc(l.slice(0, i + 1))}</span> ${esc(l.slice(i + 1).trim())}</p>` : `<p>${esc(l)}</p>`; };

  // ══ Команда ══
  function secTeam() {
    const ms = pick(cur()), pv = pick(prev());
    const P = ms.filter(m => !m.tour), O = ms.filter(m => m.tour);
    const tp = tally(P), to = tally(O);
    const T = ms.reduce((s, m) => s + (m.t || 0), 0), C = ms.reduce((s, m) => s + (m.ct || 0), 0);
    const g = teamGrade(ms), gp = teamGrade(pv);
    const gx = [ms, pv, ...trendIdx().map(i => pick(weekR(i)))].some(l => l.some(m => hasHx(m.players)));
    const pc = t => t.w + t.l ? ` · ${Math.round(100 * t.w / (t.w + t.l))}%` : '';
    const tiles = `<div class="grid tiles">
      <div class="card tile"><div class="k">Праки</div><div class="val">${P.length ? wlStr(tp) : '—'}</div><div class="note">${P.length ? mapsN(P.length) + pc(tp) : 'не было'}</div></div>
      <div class="card tile"><div class="k">Офки</div><div class="val">${O.length ? wlStr(to) : '—'}</div><div class="note">${O.length ? mapsN(O.length) + pc(to) : 'не было'}</div></div>
      <div class="card tile"><div class="k">Раунды T / CT</div><div class="val">${T} / ${C}</div><div class="split"><i style="flex:${T || 1};background:var(--t)"></i><i style="flex:${C || 1};background:var(--ct)"></i></div></div>
      <div class="card tile"><div class="k">Голова, среднее</div><div class="val">${fmt(g, 2)}</div><div class="note">${delta(g, gp, 2)}${span() ? ' к прошлому периоду' : ''}</div>${gx ? '<div class="note small">До 07.10 это среднее Мак, Ком и Кол.</div>' : ''}</div>
    </div>`;

    const mp = byMap(ms);
    const bmax = Math.max(1, ...mp.map(([, l]) => Math.max(l.reduce((s, m) => s + (m.t || 0), 0), l.reduce((s, m) => s + (m.ct || 0), 0))));
    let rows = '';
    for (const [name, list] of mp) {
      const p = list.filter(m => !m.tour), o = list.filter(m => m.tour), a = tally(p), b = tally(o);
      const t = list.reduce((s, m) => s + (m.t || 0), 0), c = list.reduce((s, m) => s + (m.ct || 0), 0);
      rows += `<tr><td class="map">${esc(name)}</td><td class="num">${p.length ? wlStr(a) : '—'}</td>${pctTd(a.w, a.w + a.l)}<td class="num">${o.length ? wlStr(b) : '—'}</td>${pctTd(b.w, b.w + b.l)}
        <td><div class="bars"><div class="barrow"><span class="bar" style="width:${(90 * t / bmax).toFixed(1)}px"></span>${t}</div><div class="barrow"><span class="bar ct" style="width:${(90 * c / bmax).toFixed(1)}px"></span>${c}</div></div></td></tr>`;
    }
    let prow = '';
    for (const [name, list] of mp.concat([['Итого', ms]])) {
      prow += `<tr class="${name === 'Итого' ? 'total' : ''}"><td class="map">${esc(name)}</td>${['ct', 't'].flatMap(s => sideSplit(list, s)).map(([w, n]) => pctTd(w, n)).join('')}</tr>`;
    }
    const lv = new Map();
    for (const m of ms) { const k = m.lvl || 'не указан'; if (!lv.has(k)) lv.set(k, []); lv.get(k).push(m); }
    const lord = k => { const i = D.levels.indexOf(k); return i < 0 ? 99 : i; };
    let lrow = '';
    for (const k of [...lv.keys()].sort((a, b) => lord(a) - lord(b))) {
      const l = lv.get(k), p = tally(l.filter(m => !m.tour)), o = tally(l.filter(m => m.tour));
      lrow += `<tr><td class="map">${esc(k)}</td><td class="num">${p.n ? wlStr(p) : '—'}</td>${pctTd(p.w, p.w + p.l)}<td class="num">${o.n ? wlStr(o) : '—'}</td>${pctTd(o.w, o.w + o.l)}</tr>`;
    }
    const idx = trendIdx(), labels = idx.map(i => W[i].lo);
    const wr = idx.map(i => { const t = tally(pick(weekR(i))); return t.w + t.l ? 100 * t.w / (t.w + t.l) : null; });
    const gr = idx.map(i => teamGrade(pick(weekR(i))));
    const empty = '<p class="empty">За период матчей нет.</p>';
    return section('Команда', `${tiles}
      <div class="grid two stack">
        <div class="card"><h3>Карты <span class="legend"><span><i class="sw" style="background:var(--t)"></i>T</span><span><i class="sw" style="background:var(--ct)"></i>CT</span></span></h3>
          ${mp.length ? `<div class="scroll"><table><tr><th>Карта</th><th class="num">праки</th><th class="num">win%</th><th class="num">офки</th><th class="num">win%</th><th>раунды</th></tr>${rows}</table></div>` : empty}</div>
        <div class="card"><h3>Пистолетки и второй раунд</h3>
          ${mp.length ? `<div class="scroll"><table><tr><th>Карта</th><th class="num">CT пист</th><th class="num">CT конв</th><th class="num">CT форс</th><th class="num">T пист</th><th class="num">T конв</th><th class="num">T форс</th></tr>${prow}</table></div>
          <p class="muted small">Выиграли пист, второй раунд идёт в конверсию. Проиграли, идёт в форс. Эко не считается. Мелкая цифра показывает, сколько было таких раундов, серым отмечено меньше трёх.</p>` : empty}</div>
        <div class="card"><h3>По уровню соперника</h3>
          ${lrow ? `<div class="scroll"><table><tr><th>Уровень</th><th class="num">праки</th><th class="num">win%</th><th class="num">офки</th><th class="num">win%</th></tr>${lrow}</table></div>` : empty}</div>
        <div class="card"><h3>Тренд по неделям</h3>
          <div class="minis"><div><div class="k">винрейт</div>${line(wr, labels, {min: 0, max: 100, suf: '%'})}</div><div><div class="k">голова</div>${line(gr, labels, {min: 1, max: 5, dec: 1})}</div></div></div>
      </div>`);
  }

  // ══ Игроки ══
  function secPlayers() {
    const nicks = S.player === 'all' ? D.roster.map(r => r.nick) : [S.player];
    const ms = pick(cur()), pv = pick(prev()), idx = trendIdx(), labels = idx.map(i => W[i].lo), wk = W[S.week];
    const base = teamBase();
    const duelsAll = D.roster.reduce((t, r) => t + agg(rowsOf(ms, r.nick)).duels, 0);
    const cards = nicks.map(nick => {
      const r = D.roster.find(x => x.nick === nick) || {nick: nick, role: 'роль не задана', goal: null};
      const a = agg(rowsOf(ms, nick)), b = agg(rowsOf(pv, nick));
      const ser = idx.map(i => agg(rowsOf(pick(weekR(i)), nick)));
      const rt = ser.map(x => x.rating), gt = ser.map(x => x.hd);
      const hxAny = a.hx || b.hx || ser.some(x => x.hx);   // сравнение и тренд тоже могут стоять на старых оценках
      const flags = [];
      const fl = (vals, eps, what, dec) => {
        const f = falling(vals, eps, idx);
        if (!f) return;
        const old = what === 'голова' && f.from < HEAD_FROM ? ` ${HX_NOTE}` : '';
        flags.push(`<span class="flag" title="Считается по восьми последним неделям при текущих фильтрах. Неделя без игр рвёт ряд.${old}">▼ ${what}: четыре недели подряд вниз, ${ddmm(f.from)}–${ddmm(f.to)} · ${f.vals.map(v => v.toFixed(dec)).join(' → ')}</span>`);
      };
      fl(rt, 0.01, 'рейтинг', 2);
      fl(gt, 0.05, 'голова', 1);
      const gl = goalOf(r);
      const gtip = gl == null ? '' : ` title="Цель на период, фиксированная. Норма роли рядом плавает вместе с командой, цель — нет."`;
      const target = gl == null ? '<span class="muted">цель не задана</span>'
        : a.rating == null ? `<span${gtip}>цель ${gl.toFixed(2)}</span>`
        : `<span class="${a.rating >= gl ? 'good' : 'crit'}"${gtip}>${a.rating >= gl ? '▲' : '▼'} цель ${gl.toFixed(2)}</span>`;
      const norm = normBlock(r, a, base);
      const spots = Object.keys(D.positions || {}).filter(m => posPair(nick, m))
        .map(m => `<span class="chip">${esc(m)} <b>${esc(posPair(nick, m))}</b></span>`).join('');
      const share = duelsAll ? 100 * a.duels / duelsAll : null;
      const stat = (k, lab, d) => `<div><div class="k">${lab}</div><div class="v">${fmt(a[k], d)}</div>${delta(a[k], b[k], d)}</div>`;
      const tr = D.training.filter(x => x.p === nick && x.date >= wk.lo && x.date <= wk.hi);
      const trBy = new Map(tr.map(x => [x.date, x]));
      const trd = new Set(tr.filter(did).map(x => x.date));
      const hs = holeSum(tr);
      const strip = weekDays(wk).map(d => { const x = trBy.get(d), h = holes(x);
        return `<i class="${trd.has(d) ? 'on' : ''}${h.length ? ' hole' : ''}${isOff(d) ? ' off' : ''}" title="${wday(d)} ${ddmm(d)}: ${dayWord(x)}${h.length && did(x) ? ', не заполнил ' + h.join(', ') : h.length ? ' ' + h.join(', ') : ''}"></i>`; }).join('');
      const trainTxt = `<span class="istrip" aria-hidden="true">${strip}</span><b class="cnt">${trd.size} из 7 дней</b>`
        + (hs.cells ? ` <span class="crit">· не заполнил ${plural(hs.cells, 'клетку', 'клетки', 'клеток')}</span>` : '');
      return `<article class="card pcard">
        <div class="phead"><h3>${esc(nick)}</h3><span class="role">${esc(r.role)}</span>${flags.join('')}</div>
        <div class="pbody">
          <div class="rating"><div class="k">Rating</div><div class="big">${fmt(a.rating, 2)}</div>${delta(a.rating, b.rating, 2)}${norm}<div class="tg">${target}</div></div>
          <div class="kvs"><div class="kv">${stat('adr', 'ADR', 0)}${stat('kd', 'K/D', 2)}${stat('hs', 'HS%', 0)}<div><div class="k">карт</div><div class="v">${a.n}</div><div class="dl none">за период</div></div></div>
            <div class="kv grades"><div><div class="k">голова</div><div class="v">${fmt(a.hd, 2)}</div>${delta(a.hd, b.hd, 2)}</div><div><div class="k">карт с оценкой</div><div class="v sm">${a.hn}</div><div class="dl none">за период</div></div>${hxAny ? `<p class="hnote">${HX_NOTE}</p>` : ''}</div></div>
          <div class="sides">
            <div class="sd t"><span>T</span><b>${fmt(a.t && a.t.rating, 2)}</b>${sideNorm(r, a.t, base, 2)}<small>${a.t ? 'ADR ' + Math.round(a.t.adr) + ' · K/D ' + fmt(a.t.kd, 2) : 'нет данных'}</small></div>
            <div class="sd ct"><span>CT</span><b>${fmt(a.ct && a.ct.rating, 2)}</b>${sideNorm(r, a.ct, base, 1)}<small>${a.ct ? 'ADR ' + Math.round(a.ct.adr) + ' · K/D ' + fmt(a.ct.kd, 2) : 'нет данных'}</small></div>
          </div>
          ${duelBlock(r, a, share)}
          ${hltvIn(nick, ms)}
          <div class="prow">
            <div><div class="k">рейтинг по неделям <span class="muted">${rt.length} недель, при текущих фильтрах</span></div>${line(rt, labels, {dec: 2, w: 460, h: 190, goal: gl})}</div>
            <div><div class="k">голова по неделям</div>${line(gt, labels, {min: 1, max: 5, dec: 1, w: 460, h: 190})}</div>
          </div>
        </div>
        ${spots ? `<p class="spots"><b>Позиции</b><span class="chips">${spots}</span></p>` : ''}
        <p class="train"><b>Инд. за неделю ${ddmm(wk.lo)}–${ddmm(wk.hi)}</b>${trainTxt}</p>
      </article>`;
    }).join('');
    const src = agg(rowsOf(ms, nicks[0])).src;
    const how = src === 'пракком'
      ? 'Рейтинг и стороны взяты с праккома по каждому матчу.'
      : `Рейтинг примерный, по формуле HLTV 2.0: KAST в табе нет, взят средний ${D.kast}%. Матчи, которых нет на праккоме, считаются так.`;
    return section('Игроки', `<p class="lead">Стрелка показывает, куда сдвинулось к прошлому периоду. ${how} `
      + `«Норма роли» это ожидаемый рейтинг под его роль.</p>${hltvSeg()}<div class="grid">${cards}</div>`);
  }

  // ══ По картам ══
  function secMaps() {
    const ms = pick(cur(), false);
    const nicks = S.player === 'all' ? D.roster.map(r => r.nick) : [S.player];
    let mp = byMap(ms);
    if (S.map !== 'all') mp = mp.filter(([m]) => m === S.map);
    if (!mp.length) return section('По картам', '<div class="card"><p class="empty">За период матчей нет.</p></div>');
    const maps = mp.map(([m]) => m), count = new Map(mp.map(([m, l]) => [m, l.length]));
    const info = {};
    let body = '';
    for (const nick of nicks) {
      const rows = rowsOf(ms, nick);
      const all = agg(rows);
      const own = mean(rows.map(x => x.hd));
      info[nick] = {rows, adrBase: all.adr, base: all.rating, kdAll: all.kd, own};
      body += `<tr><th class="nick">${esc(nick)}</th>` + maps.map(m => {
        const r = rows.filter(x => x.map === m), a = agg(r);
        if (a.rating == null) return '<td class="cell"><div class="c few"><b>—</b></div></td>';
        const few = r.length < 2, sd = x => x ? x.rating.toFixed(2) : '—';
        const nm = mapNormBoth(nick, m);
        const bg = few || nm == null ? '' : ` style="background:${tint((a.rating - nm) / 0.35)}"`;
        const pp = posPair(nick, m), tg = tgLine(nick, m);
        return `<td class="cell"><div class="c${few ? ' few' : ''}"${bg} title="${esc(nick)} на ${esc(m)}: рейтинг ${a.rating.toFixed(2)} при норме ${fmt(nm, 2)} на этой карте, ${mapsN(r.length)}${pp ? '. Позиция: ' + esc(pp) : ''}${tg ? '. ' + esc(tg) : ''}">`
          + `<b>${a.rating.toFixed(2)}</b><span>K/D ${fmt(a.kd, 2)}</span>`
          + `<span class="sd2"><i class="t">T ${sd(a.t)}</i><i class="ct">CT ${sd(a.ct)}</i></span></div></td>`;
      }).join('') + '</tr>';
    }
    const head = '<tr><th></th>' + maps.map(m => `<th class="c">${esc(m)}<small>${mapsN(count.get(m))}</small></th>`).join('') + '</tr>';

    let sag = '';
    for (const nick of nicks) {
      const {rows, adrBase, kdAll, own} = info[nick];
      const found = [];
      for (const m of maps) {
        const r = rows.filter(x => x.map === m);
        if (r.length < 2) continue;
        const toks = []; let sev = 0;
        const v = mean(r.map(x => x.adr));
        if (v != null && adrBase != null && Math.round(adrBase) - Math.round(v) >= SAG.adr) { toks.push(`ADR <b>${Math.round(v)}</b> на карте, своё ${Math.round(adrBase)}`); sev += (adrBase - v) / 12; }
        const k = r.reduce((s, x) => s + (x.k || 0), 0), d = r.reduce((s, x) => s + (x.d || 0), 0);
        if (d && kdAll != null && Number(kdAll.toFixed(2)) - Number((k / d).toFixed(2)) >= SAG.kd - 1e-9) { toks.push(`K/D <b>${(k / d).toFixed(2)}</b> на карте, своё ${kdAll.toFixed(2)}`); sev += (kdAll - k / d) / 0.15; }
        const rg = r.filter(x => x.hd != null), hv = rg.length >= 2 ? mean(rg.map(x => x.hd)) : null;
        if (hv != null && own != null && Number(own.toFixed(1)) - Number(hv.toFixed(1)) >= SAG.hd - 1e-9) { toks.push(`голова <b>${hv.toFixed(1)}</b> на карте${rg.length < r.length ? ` (оценено ${rg.length})` : ''}, своя ${own.toFixed(1)}`); sev += (own - hv) / 0.8; }
        if (toks.length) found.push({m, n: r.length, toks, sev});
      }
      found.sort((p, q) => q.sev - p.sev);
      sag += `<div class="sagp"><div class="nick">${esc(nick)}</div><div class="sagl">${found.length
        ? found.map(f => `<div class="sagr"><span class="m">▼ ${esc(f.m)}</span><span class="t">${f.toks.join(' · ')}</span><span class="n">${mapsN(f.n)}</span></div>`).join('')
        : '<div class="sagr"><span class="muted">ниже своего нигде</span></div>'}</div></div>`;
    }

    return section('По картам', `
      <div class="card"><h3>Рейтинг по картам <span class="legend"><span><i class="sw" style="background:${tint(-1)}"></i>ниже своего</span><span><i class="sw" style="background:${tint(0)}"></i>как обычно</span><span><i class="sw" style="background:${tint(1)}"></i>выше своего</span><span><i class="sw" style="border:1px solid var(--ring)"></i>меньше двух карт</span></span></h3>
        <div class="scroll"><table class="mx">${head}${body}</table></div></div>
      <div class="card stack"><h3>Где проседает <span class="muted">первая цифра на карте, вторая своя за период</span></h3>${sag}
        <p class="muted small">Сюда попадает то, что ниже своего: ADR на ${SAG.adr} и больше, K/D на ${SAG.kd}, голова на ${SAG.hd}. Сверху стоит то, где просадка сильнее. Справа сколько карт сыграно.</p></div>
      <h3 class="subh">Голова по картам</h3>
      ${gradeChart(ms, maps)}`);
  }

  /* Голова по картам графиком: по столбцу на карту, цвет карты, высота это средняя голова
     игрока на этой карте. Пунктир это его средняя за период. Игроки листаются стрелками
     по бокам, рядом с каждым столбцом можно поставить контур другого игрока. */
  const MAPCOL = {'Mirage': '#e2b84c', 'Ancient': '#4fb38a', 'Anubis': '#a98be8', 'Nuke': '#58b8d8',
                  'Inferno': '#e07a5f', 'Dust 2': '#cdb98f', 'Train': '#9aa3b5', 'Overpass': '#7bc96f',
                  'Vertigo': '#e889b5', 'Cache': '#b0b0a8'};
  const MAPCOL_X = ['#e889b5', '#7bc96f', '#9aa3b5', '#b0b0a8'];
  const mapCol = (m, i) => MAPCOL[m] || MAPCOL_X[i % MAPCOL_X.length];
  function gradeChart(ms, maps) {
    const nicks = D.roster.map(r => r.nick);
    if (S.player !== S.gpFor) { S.gpFor = S.player; if (S.player !== 'all') S.gp = Math.max(0, nicks.indexOf(S.player)); }
    const i = ((S.gp % nicks.length) + nicks.length) % nicks.length, nick = nicks[i], rr = D.roster[i];
    if (S.gcmp === nick) S.gcmp = '';
    const cmp = S.gcmp;
    const rowsBy = new Map(nicks.map(n => [n, rowsOf(ms, n)]));
    const at = (who, m) => { const r = rowsBy.get(who).filter(x => x.map === m && x.hd != null); return {v: mean(r.map(x => x.hd)), n: r.length}; };
    const own = who => mean(rowsBy.get(who).map(x => x.hd));
    maps = maps.filter(m => [nick, cmp].some(w => w && at(w, m).v != null));
    const VW = 660, VH = 262, L = 28, R = 66, T = 18, B = 42, ih = VH - T - B;
    const nb = Math.max(1, maps.length), gw = (VW - L - R) / nb, gap = 6;
    const bw = cmp ? Math.min(40, (gw - 18 - gap) / 2) : Math.min(56, gw - 18);
    const y = v => T + ih - (v / 5) * ih;
    const f1 = v => v.toFixed(1);
    // подпись над столбцом на подложке цвета карточки: пунктир своей средней идёт сквозь подписи
    const lab = (cx, yb, v) => { const t = v.toFixed(1), w = t.length * 7 + 6;
      return `<rect class="bvbg" x="${f1(cx - w / 2)}" y="${f1(yb - 11)}" width="${f1(w)}" height="14" rx="2"/><text class="bv" x="${f1(cx)}" y="${f1(yb)}" text-anchor="middle">${t}</text>`; };
    let svg = '', bars = '', ghosts = '', labels = '', axis = '', any = false;
    for (let g = 1; g <= 5; g++) svg += `<line class="gl" x1="${L}" x2="${VW - R}" y1="${f1(y(g))}" y2="${f1(y(g))}"/><text class="tick" x="${L - 6}" y="${f1(y(g) + 3)}" text-anchor="end">${g}</text>`;
    svg += `<line class="base" x1="${L}" x2="${VW - R}" y1="${f1(y(0))}" y2="${f1(y(0))}"/>`;
    maps.forEach((m, j) => {
      const gx = L + j * gw, x = gx + (gw - (cmp ? 2 * bw + gap : bw)) / 2, xc = x + bw + gap;
      const a = at(nick, m), c = cmp ? at(cmp, m) : null;
      if (a.v != null) {
        any = true;
        bars += `<rect x="${f1(x)}" y="${f1(y(a.v))}" width="${f1(bw)}" height="${f1(y(0) - y(a.v))}" rx="3" fill="${mapCol(m, j)}"${a.n < 2 ? ' opacity=".45"' : ''}><title>${esc(nick)} · ${esc(m)}: голова ${a.v.toFixed(1)}, ${mapsN(a.n)} с оценкой</title></rect>`;
        labels += lab(x + bw / 2, y(a.v) - 4, a.v);
      }
      if (c && c.v != null) {
        any = true;
        ghosts += `<rect class="ghost" x="${f1(xc)}" y="${f1(y(c.v))}" width="${f1(bw)}" height="${f1(y(0) - y(c.v))}" rx="3"${c.n < 2 ? ' opacity=".55"' : ''}><title>${esc(cmp)} · ${esc(m)}: голова ${c.v.toFixed(1)}, ${mapsN(c.n)} с оценкой</title></rect>`;
        // столбцы узкие, а значения близкие: подпись контура уходит внутрь него, чтобы не налезть на соседнюю
        const inside = a.v != null && bw + gap < 28 && Math.abs(y(a.v) - y(c.v)) < 15;
        labels += lab(xc + bw / 2, inside ? y(c.v) + 15 : y(c.v) - 4, c.v);
      }
      axis += `<text class="cat" x="${f1(gx + gw / 2)}" y="${VH - B + 17}" text-anchor="middle">${esc(m)}</text>`
        + `<text class="catn" x="${f1(gx + gw / 2)}" y="${VH - B + 31}" text-anchor="middle">${cmp ? `карт ${a.n} / ${c.n}` : mapsN(a.n)}</text>`;
    });
    const o = own(nick), oc = cmp ? own(cmp) : null;
    const ownLn = o == null ? '' : `<line class="own" x1="${L}" x2="${VW - R}" y1="${f1(y(o))}" y2="${f1(y(o))}"><title>${esc(nick)}: своя средняя ${o.toFixed(1)}</title></line>`
      + `<text class="ownlab" x="${VW - R + 6}" y="${f1(y(o) + 3.5)}">своя ${o.toFixed(1)}</text>`;
    svg += bars + ghosts + ownLn + labels + axis;
    const shown = rowsBy.get(nick).concat(cmp ? rowsBy.get(cmp) : []).filter(x => maps.includes(x.map));
    const sws = maps.slice(0, 3).map((m, j) => mapCol(m, j));         // образец столбцов: цвета первых карт
    if (sws.length < 2) sws.push(sws[0] || 'var(--ink-2)', sws[0] || 'var(--ink-2)');
    const legend = (cmp ? `<span><i class="sw" style="background:linear-gradient(90deg,${sws.join(',')})"></i>${esc(nick)}</span>` : '')
      + `<span><i class="sw ownsw"></i>своя средняя ${esc(nick)}</span>`
      + (cmp ? `<span><i class="sw ghostsw"></i>${esc(cmp)} <small>своя ${fmt(oc, 1)}</small></span>` : '');
    const opts = '<option value="">никого</option>' + nicks.filter(n => n !== nick).map(n => `<option value="${esc(n)}"${n === cmp ? ' selected' : ''}>${esc(n)}</option>`).join('');
    return `<div class="card gchart">
        <div class="ghead"><div class="gwho" id="gwho"><b>${esc(nick)}</b><span class="role">${esc(rr.role)}</span><span class="muted small">${i + 1} из ${nicks.length}</span></div>
          <label class="sel"><span>сравнить с</span><select id="gcmp" aria-label="Поставить рядом голову другого игрока">${opts}</select></label></div>
        <div class="gbody"><button type="button" class="gnav" data-gnav="-1" aria-label="Предыдущий игрок" aria-describedby="gwho">◀</button>
          ${any ? `<div class="scroll gscroll"><svg class="chart gsvg" viewBox="0 0 ${VW} ${VH}" role="group" aria-label="Голова ${esc(nick)} по картам${cmp ? ', рядом ' + esc(cmp) : ''}">${svg}</svg></div>` : '<p class="empty gempty">За период оценок нет.</p>'}
          <button type="button" class="gnav" data-gnav="1" aria-label="Следующий игрок" aria-describedby="gwho">▶</button></div>
        ${any ? `<div class="legend glegend">${legend}</div>
        <p class="muted small">Под картой сказано, за сколько карт есть оценка${cmp ? ', слева у ' + esc(nick) + ', справа у ' + esc(cmp) : ''}. Бледный столбец значит, что оценка только за одну карту.${hasHx(shown) ? ' ' + HX_NOTE : ''}</p>` : ''}
      </div>`;
  }

  /* Норма роли. База это средний рейтинг нашей же пятёрки за период: числа топ-50 к нашему
     уровню не применимы, а РАЗНИЦА между ролями применима. Её и взяли с HLTV. */
  /* База норм роли фиксированная: 1.00 это рейтинг равной игры, от неё же считались
     смещения ролей. Плавающая база делала планку зеркалом: сыграли плохо — норма опустилась. */
  function teamBase() { return D.base ?? 1.00; }
  /* Норма стороны: средняя цена его спотов по всему мап-пулу, плюс сдвиг на нашу шкалу
     и поправка за роль. Равными весами нарочно: норма и цель не шевелятся от периода,
     иначе плохая неделя сама себе опускает планку. */
  function spotNorm(nick, side) {
    const rows = (D.targets || []).filter(t => t.p === nick && t.side === side);
    if (!rows.length) return null;
    const val = rows.reduce((a, t) => a + t.v, 0) / rows.length;
    const rr = D.roster.find(x => x.nick === nick);
    return val + (D.shift ?? 0) + (rr && rr.pen != null ? rr.pen : 0);
  }
  function normOf(r, base, i) {
    if (!r || !r.nick) return null;
    if (i === 1) return spotNorm(r.nick, 'CT');
    if (i === 2) return spotNorm(r.nick, 'T');
    const c = spotNorm(r.nick, 'CT'), t = spotNorm(r.nick, 'T');
    return c == null || t == null ? null : (c + t) / 2;
  }
  /* Цель по рейтингу: фиксированное число, одно на период. От базы пятёрки не зависит нарочно:
     цель не должна становиться легче оттого, что команда сыграла плохую неделю. */
  function goalOf(r) { return r.goal ?? null; }
  function normBlock(r, a, base) {
    if (!r.off) return '<div class="norm muted">роль не задана</div>';
    const n = normOf(r, base, 0);
    if (n == null || a.rating == null) return '<div class="norm muted">данных мало</div>';
    const d = a.rating - n, cls = d >= 0 ? 'good' : d >= -0.09 ? '' : 'crit';
    const bar = r.star == null ? '' : `<span class="bar2">планка звезды ${(n + r.star).toFixed(2)}, `
      + `<b class="${a.rating >= n + r.star ? 'good' : 'crit'}">${a.rating >= n + r.star ? 'тянет' : 'не тянет'}</b></span>`;
    return `<div class="norm" title="${esc(r.rlabel || '')}. Норма собрана из таргетов его спотов по всему мап-пулу и приведена к нашей базе ${fmt(base, 2)}${r.pen ? ', минус ' + Math.abs(r.pen).toFixed(2) + ' за работу игла' : ''}. Допуск ±0.09, это разброс между игроками топ-30.">`
      + `норма роли ${n.toFixed(2)} <b class="${cls}">${d >= 0 ? '+' : ''}${d.toFixed(2)}</b>${bar}</div>`;
  }
  function sideNorm(r, side, base, i) {
    if (!r.off || !side) return '';
    const n = normOf(r, base, i);
    if (n == null) return '';
    const d = side.rating - n;
    return `<em class="${d >= 0 ? 'good' : d >= -0.09 ? 'muted' : 'crit'}" title="норма роли на этой стороне">норма ${n.toFixed(2)}, ${d >= 0 ? '+' : ''}${d.toFixed(2)}</em>`;
  }
  /* Первые дуэли переносятся с топ-30 без поправки на уровень: доля по построению делится
     внутри пятёрки, а успешность центрирована около половины внутри закрытого пула. */
  function duelBlock(r, a, share) {
    if (!r.duel || !a.duels) return '';
    const [dlo, dn, dhi] = r.duel, [wlo, wn, whi] = r.win;
    const sc = share == null ? '' : share < dlo ? 'crit' : share > dhi ? 'warn' : 'good';
    const wc = a.win < wlo ? 'crit' : a.win > whi ? 'warn' : 'good';
    return `<div class="duel"><div class="k">Первые дуэли <span class="muted">${a.duels} за период</span></div>`
      + `<div class="drow"><span>доля команды</span><b class="${sc}">${share == null ? '—' : share.toFixed(0) + '%'}</b><i>норма ${dn}%, коридор ${dlo}–${dhi}</i></div>`
      + `<div class="drow"><span>выигрывает</span><b class="${wc}">${a.win.toFixed(0)}%</b><i>норма ${wn}%, коридор ${wlo}–${whi}</i></div></div>`;
  }

  // ══ Матчи за период ══
  function secMatches() {
    const ms = pick(cur()).slice().sort((a, b) => a.date < b.date ? 1 : -1);
    if (!ms.length) return section('Матчи за период', '<div class="card"><p class="empty">Матчей нет.</p></div>');
    const pist = (m, side) => {
      const p = m[side + 'p'], x = m[side + '2'];
      if (p !== true && p !== false) return '—';
      return (p ? 'взяли' : 'слили') + (x === true ? ', второй взяли' : x === false ? ', второй слили' : '');
    };
    const items = ms.map(m => {
      const w = won(m), cls = w === true ? 'win' : w === false ? 'loss' : 'draw';
      const head = `<summary><span class="d">${ddmm(m.date)}</span><span class="mp">${esc(m.map || '—')}</span>`
        + `<span class="vs">${esc(m.enemy || '—')}</span><span class="lv">${esc(lvlOf(m))}</span>`
        + `<span class="sc ${cls}">${m.us ?? '—'}:${m.them ?? '—'}</span>`
        + `<span class="tp">${m.tour ? (m.link ? `<a href="${esc(m.link)}" target="_blank" rel="noopener">${esc(m.tour)}</a>` : esc(m.tour)) : 'прак'}</span></summary>`;
      const rows = m.players.map(p => `<tr><td>${esc(p.p)}</td><td class="num">${fmt(p.r, 2)}</td>`
        + `<td class="num">${p.k ?? '—'}–${p.a ?? '—'}–${p.d ?? '—'}</td><td class="num">${fmt(p.adr, 0)}</td>`
        + `<td class="num">${fmt(p.hs, 0)}</td>`
        + `<td class="num">${p.t ? p.t.rating.toFixed(2) : '—'}</td><td class="num">${p.ct ? p.ct.rating.toFixed(2) : '—'}</td>`
        + `<td class="num">${hdTxt(p.hd)}</td></tr>`).join('');
      const body = `<div class="mdet"><div class="mmeta">`
        + `<span><i>раунды</i>T ${m.t ?? '—'} · CT ${m.ct ?? '—'}</span>`
        + `<span><i>пистолетки</i>CT ${pist(m, 'ct')} · T ${pist(m, 't')}</span>`
        + (m.drill ? `<span><i>оттачивали</i>${esc(m.drill)}${m.how ? ' · ' + esc(m.how) : ''}</span>` : '')
        + (m.goal ? `<span><i>вывод</i>${esc(m.goal)}</span>` : '')
        + `</div>`
        + (m.nostats ? '<p class="empty">Стата игроков из этого матча в счёт не идёт: играли на фане.</p>' : rows ? `<div class="scroll"><table class="mtab"><tr><th>Игрок</th><th class="num">рейтинг</th><th class="num">K–A–D</th><th class="num">ADR</th><th class="num">HS%</th><th class="num">T</th><th class="num">CT</th><th class="num">голова</th></tr>${rows}</table></div>` : '<p class="empty">Стата по игрокам не занесена.</p>')
        + `</div>`;
      return `<details class="match ${cls}" data-k="${esc(m.date + '|' + (m.map || '') + '|' + (m.enemy || ''))}">${head}${body}</details>`;
    }).join('');
    const hx = ms.some(m => hasHx(m.players));
    return section('Матчи за период', `<p class="lead">Каждый матч разворачивается. Голова это оценка IGL игроку за матч, от 1 до 5, прочерк значит, что её нет.${hx ? ' ' + HX_NOTE + ' Поэтому там она дробная.' : ''}</p><div class="card matches">${items}</div>`);
  }

  // ══ Про игрока ══
  function secPlayer(nick) {
    const r_ = cur(), ms = pick(r_), rows = rowsOf(ms, nick);
    if (!rows.length) return section('Про ' + nick, '<div class="card"><p class="empty">За период у него матчей нет.</p></div>');
    const withR = rows.filter(x => x.r != null).slice().sort((a, b) => b.r - a.r);
    const one = x => `<li><span class="d">${ddmm(x.date)}</span><b>${x.r.toFixed(2)}</b> ${esc(x.map)} · ${x.k}–${x.a}–${x.d} · ADR ${Math.round(x.adr)}</li>`;
    const best = withR.slice(0, 3).map(one).join('');
    const worst = withR.slice(-3).reverse().map(one).join('');
    const byM = new Map();
    for (const x of rows) { if (!x.map) continue; if (!byM.has(x.map)) byM.set(x.map, []); byM.get(x.map).push(x); }
    const maps = [...byM.entries()].map(([m, r]) => [m, agg(r), r.length])
      .filter(x => x[1].rating != null).sort((a, b) => b[1].rating - a[1].rating);
    const tgCell = (nick2, m, side, val) => {
      const n = mapNorm(nick2, m, side), t = tgOf(nick2, m, side);
      if (n == null) return `<td class="num">${fmt(val, 2)}</td>`;
      const d = val == null ? null : val - n;
      const cls = d == null ? '' : d >= 0 ? 'good' : d >= -0.09 ? '' : 'crit';
      return `<td class="num ${cls}" title="норма на этом споте ${n.toFixed(2)}${t.found ? '' : ', число выведено'}">`
        + `${fmt(val, 2)}<sub>${n.toFixed(2)}${t.found ? '' : '*'}</sub></td>`;
    };
    const mrows = maps.map(([m, a, n]) => `<tr><td>${esc(m)}<small class="pos">${esc(posPair(nick, m) || '')}</small></td>`
      + `<td class="num"><b>${a.rating.toFixed(2)}</b></td>`
      + tgCell(nick, m, 'T', a.t && a.t.rating) + tgCell(nick, m, 'CT', a.ct && a.ct.rating)
      + `<td class="num">${fmt(a.kd, 2)}</td><td class="num">${fmt(a.adr, 0)}</td><td class="num">${mapsN(n)}</td></tr>`).join('');
    const tr = D.training.filter(x => x.p === nick && x.date >= r_[0] && x.date <= r_[1] && (did(x) || holes(x).length));
    const trList = tr.length
      ? `<div class="ilist">${tr.map(x => `<div class="iday"><div class="dd"><b>${wday(x.date)} ${ddmm(x.date)}</b></div><div>${dayCell(x)}</div></div>`).join('')}</div>`
      : '<p class="muted">За период ничего не записано.</p>';
    const said = [];
    for (const e of D.journal) {
      if (!e.date || e.date < r_[0] || e.date > r_[1]) continue;
      for (const l of e.lines) if (l.toLowerCase().includes(nick.toLowerCase())) said.push(`<li><span class="d">${ddmm(e.date)}</span>${esc(l.replace(/^[-•*]\s*/, ''))}</li>`);
    }
    return section('Про ' + nick, `
      <div class="grid two">
        <div class="card"><h3>Лучшие карты периода</h3><ul class="tl">${best || '<li class="muted">нет данных</li>'}</ul></div>
        <div class="card"><h3>Худшие карты периода</h3><ul class="tl">${worst || '<li class="muted">нет данных</li>'}</ul></div>
      </div>
      <div class="card"><h3>Карты по рейтингу <span class="muted">мелким под цифрой — норма на этом споте</span></h3>${mrows ? `<div class="scroll"><table><tr><th>Карта</th><th class="num">рейтинг</th><th class="num">T</th><th class="num">CT</th><th class="num">K/D</th><th class="num">ADR</th><th class="num">карт</th></tr>${mrows}</table></div>
        <p class="muted small">Норма на споте это цена позиции у топ-50, приведённая к нашей шкале. Звёздочка значит, что исходное число выведено из соседних спотов, а не найдено. Сравнивать честно только внутри одной карты: уровни между картами собраны разными способами.</p>` : '<p class="empty">Нет данных.</p>'}</div>
      <div class="grid two">
        <div class="card"><h3>Инд. тренировка за период</h3>${trList}</div>
        <div class="card"><h3>Что про него писали <span class="muted">строки из журнала и разборов</span></h3>${said.length ? `<ul class="tl">${said.join('')}</ul>` : '<p class="muted">Ничего не записано.</p>'}</div>
      </div>`);
  }

  // ══ Неделя ══
  function ideaCounts(wk) {
    /* Судьбу идей Рома присылает словами в конце недели, в журнал она ложится строкой
       вида «Думалка: внесли 7, на тест 3, отклонили 4». Цвет строк в листе не читаем. */
    const num = (txt, re) => { const m = txt.match(re); return m ? Number(m[1]) : null; };
    for (const e of D.journal) {
      if (!e.date || e.date < wk.lo || e.date > wk.hi) continue;
      for (const l of e.lines.concat(e.notes || [])) {
        if (!/думалк/i.test(l)) continue;
        const o = {in: num(l, /внес[а-я]*\s+(\d+)/i), test: num(l, /тест[а-я]*\s+(\d+)/i),
                   no: num(l, /(?:отклон|отказ)[а-я]*\s+(\d+)/i)};
        if (o.in != null || o.test != null || o.no != null) return o;
      }
    }
    return null;
  }

  // ══ Атрибуты HLTV ══
  /* Как профиль игрока на HLTV (Rating 3.0): семь атрибутов 0–100 и под каждым показатели.
     Формулы восстановлены по архивным страницам HLTV, разбор в cs-parser/hltv-атрибуты.json:
     полоска показателя = 100·Φ((x−μ)/σ) с замороженными μ/σ «средний топ-про», ноль даёт 0,
     атрибут = округлённая взвешенная сумма полосок. Шкала про-сцены, как у HLTV: против
     слабых соперников цифры выше, Рома 05.10: «там всё очевидно, что это набито против слабых».
     Сырьё — счётчики по раундам из повторов праккома (pracc_hltv.js), офок там нет. */
  const HK = D.hkeys || [];
  const erf = x => { const s = Math.sign(x); x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x);
    return s * (1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x)); };
  const Phi = z => 0.5 * (1 + erf(z / Math.SQRT2));
  // [μ, σ] для обеих сторон, CT и T. У показателей «только для вида» стороны HLTV не раскрыл,
  // для них везде стоит общая пара.
  const HC = {
    kpr: [[0.667, 0.0817], [0.698, 0.096], [0.636, 0.088]], adr: [[73.02, 7.83], [76.21, 8.72], [69.83, 8.47]],
    mk: [[15.44, 2.90], [16.98, 3.48], [14.96, 3.30]], rk: [[45.25, 4.18]], kw: [[0.922, 0.115]], dw: [[92.92, 11.31]],
    sbt: [[0.1056, 0.0222], [0.0872, 0.0265], [0.1247, 0.0326]], td: [[0.1357, 0.0240], [0.1217, 0.0275], [0.1507, 0.0328]],
    tdp: [[20.21, 3.29], [18.96, 3.97], [21.37, 4.27]], odtr: [[25.52, 8.18], [22.35, 11.36], [28.29, 11.81]],
    as: [[0.180, 0.037]], sup: [[25.57, 3.40]],
    st: [[0.1040, 0.0260], [0.0867, 0.0285], [0.1225, 0.0364]], tk: [[0.1362, 0.0267], [0.1155, 0.0308], [0.1459, 0.0373]],
    tkp: [[20.91, 3.72], [17.88, 4.14], [24.25, 5.40]], akp: [[27.46, 4.92], [27.14, 3.93], [20.25, 16.22]], dpk: [[110, 7.8]],
    okl: [[0.0994, 0.0252], [0.1103, 0.0314], [0.0902, 0.0289]], odt: [[0.100, 0.0265]],
    oat: [[19.9, 4.35], [19.98, 4.54], [20.00, 5.67]], osu: [[49.95, 7.76], [54.91, 9.93], [45.00, 9.60]],
    okw: [[71.93, 8.85], [70.03, 12.33], [74.20, 12.68]], att: [[2.589, 0.388]],
    cp: [[0.0207, 0.0157], [0.0155, 0.0130], [0.0259, 0.0200]], la: [[11.06, 3.13], [10.23, 3.27], [11.86, 4.12]],
    ta: [[63.3, 5.82], [63.5, 5.74], [63.1, 6.68]], v1: [[60.5, 21.7]], sl: [[7.32, 3.11], [11.86, 4.88], [2.76, 1.98]],
    ft: [[0.504, 0.173], [0.409, 0.144], [0.600, 0.236]], ud: [[4.354, 1.454], [5.219, 1.979], [3.498, 1.400]],
    tf: [[2.560, 0.568], [2.561, 0.570], [2.029, 0.403]],
    fa: [[0.0332, 0.0228], [0.0296, 0.0215], [0.0370, 0.0316]], uk: [[0.520, 0.829], [0.773, 0.909], [0.641, 0.760]],
  };
  // Снайпинг у HLTV считается не через Φ, а насыщающейся кривой: опорные точки «значение → полоска».
  const HSN = {
    skr: [[0, 0], [0.017, 1.6], [0.054, 8.8], [0.272, 83.6], [0.312, 90.6], [0.38, 92.4], [0.425, 93.5], [1, 100]],
    skp: [[0, 0], [2.7, 1.9], [8.9, 10.1], [32.1, 61.7], [36.9, 75.3], [41.8, 88.9], [42.9, 90.1], [48.8, 91.2], [55, 92.2], [100, 100]],
    srk: [[0, 0], [1.3, 1.8], [4.0, 9.3], [20.5, 90.1], [25.9, 92.1], [33.2, 94.7], [100, 100]],
    smk: [[0, 0], [0.0033, 2.8], [0.0138, 11.5], [0.0737, 91.2], [0.111, 95.4], [1, 100]],
  };
  const SIDE_I = {both: 0, CT: 1, T: 2};
  // Сколько в среднем ослеплён один противник из EF. Точного числа у праккома нет; на оценку
  // почти не влияет (см. подпись у Utility). Уточнить можно по любой демке: player_blind.
  const BLIND_S = 2.2;   // 05.10 по демке офки с gothboiclique: 61 ослеплённый, в среднем 2.19 с
  function hbar(key, x, side, inverted) {
    if (x == null || !Number.isFinite(x)) return null;
    if (HSN[key]) { const pts = HSN[key]; if (x <= 0) return 0; for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; if (x <= x1) return y0 + (y1 - y0) * (x - x0) / (x1 - x0); } return 100; }
    const c = HC[key]; if (!c) return null;
    const [mu, sd] = c[SIDE_I[side]] || c[0];
    if (inverted) return 100 * (1 - Phi((x - mu) / sd));
    return x === 0 ? 0 : 100 * Phi((x - mu) / sd);
  }
  const hdiv = (a, b, m = 1) => b ? m * a / b : null;
  // Атрибуты: строки в порядке страницы HLTV. w — вес в оценке, без w — показатель только для вида.
  const HATTR = [
    {name: 'Firepower', ru: 'огневая мощь', rows: [
      ['kpr', 'убийства за раунд', c => hdiv(c.k, c.r), 2, 1 / 3], ['adr', 'урон за раунд', c => c.pr ? c.pdmg / c.pr : hdiv(c.dmg, c.r), 1, 1 / 3],
      ['mk', 'раунды с мультикиллом, %', c => hdiv(c.mk, c.r, 100), 1, 1 / 3], ['rk', 'раунды с убийством, %', c => hdiv(c.rk, c.r, 100), 1],
      ['kw', 'убийства за выигранный раунд', c => hdiv(c.kw, c.rw), 2], ['dw', 'урон за выигранный раунд', c => hdiv(c.dw, c.rw), 1]]},
    {name: 'Entrying', ru: 'заход первым', rows: [
      ['sbt', 'спасён тиммейтом за раунд', c => hdiv(c.sbt, c.r), 3, 0.30], ['td', 'разменянные смерти за раунд', c => hdiv(c.td, c.r), 3, 0.30],
      ['tdp', 'разменянные смерти, %', c => hdiv(c.td, c.d, 100), 1, 0.30], ['odtr', 'разменянные первые смерти, %', c => hdiv(c.odtr, c.odt, 100), 1, 0.10],
      ['as', 'ассисты за раунд', c => hdiv(c.as, c.r), 2], ['sup', 'раунды поддержки, %', c => hdiv(c.sup, c.r, 100), 1]]},
    {name: 'Trading', ru: 'размены', rows: [
      ['st', 'спас тиммейта за раунд', c => hdiv(c.st, c.r), 3, 0.30], ['tk', 'размены за раунд', c => hdiv(c.tk, c.r), 3, 0.30],
      ['tkp', 'размены от своих убийств, %', c => hdiv(c.tk, c.k, 100), 1, 0.30], ['akp', 'добивания после урона тиммейтов, %', c => hdiv(c.ak, c.k, 100), 1, 0.10],
      ['dpk', 'урон на одно убийство', c => hdiv(c.dmg, c.k), 0]]},
    {name: 'Opening', ru: 'первые дуэли', rows: [
      ['okl', 'первые убийства за раунд', c => hdiv(c.okl, c.r), 3, 0.45], ['odt', 'первые смерти за раунд', c => hdiv(c.odt, c.r), 3, null, true],
      ['oat', 'участие в первой дуэли, %', c => hdiv(c.okl + c.odt, c.r, 100), 1, 0.30], ['osu', 'выигранные первые дуэли, %', c => hdiv(c.okl, c.okl + c.odt, 100), 1, 0.15],
      ['okw', 'победа в раунде после первого убийства, %', c => hdiv(c.okw, c.okl, 100), 1, 0.10], ['att', 'атаки за раунд', c => hdiv(c.att, c.r), 2]]},
    {name: 'Clutching', ru: 'клатчи', rows: [
      ['cp', 'очки клатчей за раунд', c => hdiv(c.cp, c.r), 3, 0.75], ['la', 'последний живой, %', c => hdiv(c.la, c.r, 100), 1, 0.15],
      ['v1', '1 на 1 выиграно, %', c => hdiv(c.v1w, c.v1, 100), 0], ['ta', 'жив в раунде, секунд', c => hdiv(c.ta, c.r), 1, 0.10],
      ['sl', 'выжил в проигранном раунде, %', c => hdiv(c.sl, c.rl, 100), 1]]},
    {name: 'Sniping', ru: 'снайпинг', approx: true, rows: [
      ['skr', 'убийства со снайперки за раунд', c => hdiv(c.sk, c.r), 3, 0.20], ['skp', 'доля убийств со снайперки, %', c => hdiv(c.sk, c.k, 100), 1, 0.30],
      ['srk', 'раунды с убийством со снайперки, %', c => hdiv(c.srk, c.r, 100), 1, 0.20], ['smk', 'мультикиллы со снайперки за раунд', c => hdiv(c.smk, c.r), 3, 0.30],
      ['sok', 'первые убийства со снайперки за раунд', c => hdiv(c.sok, c.r), 3]]},
    {name: 'Utility', ru: 'гранаты', note: `время ослепления: у офок точное из демки, у пракков оценка «ослеплённые противники (EF) × ${BLIND_S} с», средняя по демкам. При любой длительности от 1.5 до 3.5 с оценка меняется не больше чем на единицу`, rows: [
      ['ud', 'урон гранатами за раунд', c => c.pr ? c.pud / c.pr : null, 1, 0.35], ['uk', 'убийства гранатами на 100 раундов', c => hdiv(c.uk, c.r, 100), 2, 0.05],
      ['ft', 'флешки за раунд', c => c.pr ? c.pft / c.pr : null, 2, 0.40], ['fa', 'флеш-ассисты за раунд', c => c.pr ? c.pfa / c.pr : null, 3, 0.10],
      ['tf', 'ослепление противников, секунд за раунд', c => c.pr ? c.tfx / c.pr : null, 2, 0.10]]},
  ];
  function hsum(ms, nick, side) {
    const c = Object.fromEntries(HK.map(k => [k, 0])); let maps = 0, offs = 0;
    const iT = HK.indexOf('tfs'), iE = HK.indexOf('pef');
    c.tfx = 0;     // время ослепления: из демки точно, у пракков оценка по EF
    for (const m of ms) for (const p of m.players) {
      if (p.p !== nick || !p.h) continue;
      maps++; if (m.tour) offs++;
      for (const s of side === 'both' ? ['CT', 'T'] : [side]) {
        const v = p.h[s]; if (!v) continue;
        HK.forEach((k, i) => { c[k] += v[i] || 0; });
        c.tfx += iT >= 0 && v[iT] != null ? v[iT] : (iE >= 0 ? (v[iE] || 0) * BLIND_S : 0);
      }
    }
    return {c, maps, offs};
  }
  function hattrs(c, side) {
    return HATTR.map(a => {
      const rows = a.rows.map(([key, label, f, dec, w, inv]) => { const v = c.r ? f(c) : null; return {key, label, v, dec, w, bar: hbar(key, v, side, inv)}; });
      const sc = rows.filter(x => x.w).reduce((s, x) => s + x.w * (x.bar ?? 0), 0);
      return {a, rows, score: c.r ? Math.round(sc) : null};
    });
  }
  const htier = v => v == null ? 'none' : v >= 66 ? 'hi' : v >= 33 ? 'md' : 'lo';
  const hbarHtml = (v, cls = '') => `<span class="hb ${cls}"><i class="${htier(v)}" style="width:${v == null ? 0 : Math.max(1.5, v).toFixed(1)}%"></i></span>`;
  function hltvSeg() {
    if (!HK.length) return '';
    return `<div class="hside" role="group" aria-label="Атрибуты HLTV: сторона">${[['both', 'обе стороны'], ['CT', 'CT'], ['T', 'T']].map(([v, l]) => `<button type="button" data-hside="${v}" aria-pressed="${S.hside === v}">${l}</button>`).join('')}</div>`;
  }
  /* Атрибуты в карточке игрока, Рома 05.10: «соедини это со статой выше, а не отдельно внизу». */
  function hltvIn(nick, ms) {
    if (!HK.length) return '';
    const side = S.hside, {c, maps, offs} = hsum(ms.filter(m => m.players.some(p => p.h)), nick, side);
    const what = !offs ? 'только праки' : offs === maps ? 'только офки' : `из них офок ${offs}`;
    const head = `<div class="k">Атрибуты HLTV <span class="muted">${side === 'both' ? 'обе стороны' : side} · ${c.r ? `${mapsN(maps)}, ${plural(c.r, 'раунд', 'раунда', 'раундов')}, ${what}` : 'матчей с разбором по раундам за период нет'}</span></div>`;
    if (!c.r) return `<div class="hin">${head}</div>`;
    const at = hattrs(c, side);
    const sel = at.find(x => x.a.name === S.hsel[nick]) || at[0];
    const main = at.map(x => `<button type="button" class="hrow${x === sel ? ' on' : ''}" data-hattr="${x.a.name}" data-hnick="${esc(nick)}" aria-pressed="${x === sel}">`
      + `<span class="hn">${x.a.name}</span>${hbarHtml(x.score)}<span class="hv"><b>${x.score ?? '—'}</b>/100</span></button>`).join('');
    const det = `<div class="hdet" aria-live="polite"><div class="hbt"><b>${sel.a.name}</b> <span class="muted">${sel.a.ru}${sel.a.approx ? ' · приближённо' : ''}</span><span class="hv"><b>${sel.score ?? '—'}</b>/100</span></div>`
      + sel.rows.map(y => `<div class="hsub${y.w ? ' w' : ''}"><span class="hl">${esc(y.label)}</span><span class="hx">${y.v == null ? '—' : y.v.toFixed(y.dec)}</span>${hbarHtml(y.bar, 'sm')}</div>`).join('')
      + (sel.a.note ? `<p class="muted small">${esc(sel.a.note)}</p>` : '') + '</div>';
    return `<div class="hin">${head}<div class="hsplit"><div class="hmain" role="group" aria-label="Атрибуты, нажми, чтобы увидеть показатели">${main}</div>${det}</div>
        <p class="muted small">0–100 как на HLTV: 50 это средний игрок топ-сцены, против слабых соперников цифры выше. Справа показатели атрибута, на который нажал; жирным то, из чего складывается оценка. Праки считаются по повторам праккома, офки по демкам с Faceit.</p>
      </div>`;
  }

  // ══ Индивидуалка ══
  /* Неделя сеткой: игроки по строкам, дни по столбцам, в клетке метки разминка / микро / макро.
     Рома 05.10: «когда там просто подряд всё идёт, очень тяжело считывается». Сверху задание
     недели, выходные приглушены. Сетка всегда за выбранную неделю: индивидуалка недельная. */
  const DTYPE = t => { const x = String(t || '').toLowerCase();
    return /off/.test(x) ? 'выходной' : /theory|теор/.test(x) ? 'теория' : /important|game|игр/.test(x) ? 'игровой день' : /practice|прак/.test(x) ? 'праки' : String(t || ''); };
  const weekDays = wk => { const d0 = new Date(wk.lo + 'T12:00:00'), out = [];
    for (let i = 0; i < 7; i++) { const d = new Date(d0); d.setDate(d0.getDate() + i); out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`); }
    return out; };
  const dayInfo = d => (D.idays || {})[d] || {};
  const isOff = d => DTYPE(dayInfo(d).type) === 'выходной';
  const TTAG = [['warmup', 'разминка', 'tw'], ['micro', 'микро', 'tm'], ['macro', 'макро', 'tc']];
  const trItems = x => TTAG.filter(([k]) => x[k]).map(([k, l, c]) => `<div class="ti"><span class="tt ${c}">${l}</span><span>${esc(x[k])}</span></div>`).join('');
  /* Правило Ромы 13.10: прочерк значит «ничего не делал», пустая клетка значит «не заполнил»,
     за это штраф. st несёт по букве на разминку, микро и макро: d сделал, n прочерк, e пусто.
     У записей до 13.10 st нет, там прочерк от пустого не отличали. Пустое ловим только
     за прошедшие дни: сегодняшний ещё могут дописать. */
  const IRULE = 'Прочерк значит, что в этот день ничего не делал. <b>Пустая клетка значит, что не заполнил, за это штраф.</b> Красным отмечено пустое за прошедшие дни.';
  const did = x => !!(x && (x.warmup || x.micro || x.macro));
  const holes = x => x && x.st && x.date < D.built ? TTAG.filter((_, i) => x.st[i] === 'e').map(([, l]) => l) : [];
  const holeSum = recs => { let cells = 0, days = 0; for (const x of recs) { const n = holes(x).length; cells += n; days += n ? 1 : 0; } return {cells, days}; };
  const dayWord = x => !x ? 'нет записи' : did(x) ? 'тренировался' : holes(x).length ? 'не заполнил'
    : x.st && x.st.includes('e') ? 'ещё не заполнено' : x.st ? 'ничего не делал' : 'ничего';
  const dayCell = x => {
    if (!x) return '<span class="none" title="строки в листе нет">—</span>';
    const h = holes(x);
    return trItems(x) + (did(x) || h.length ? '' : `<span class="nil">${dayWord(x)}</span>`)
      + (h.length ? `<div class="ihole">не заполнил: ${h.join(', ')}</div>` : '');
  };
  function secIndividual() {
    const wk = W[S.week], days = weekDays(wk);
    const nicks = S.player === 'all' ? D.roster.map(r => r.nick) : [S.player];
    const tasks = [...new Set(days.map(d => dayInfo(d).task).filter(Boolean))];
    const task = tasks.length ? `<div class="card task"><span class="k">задание недели</span>${tasks.map(t => `<p>${esc(t)}</p>`).join('')}</div>` : '';
    const wtr = D.training.filter(x => x.date >= wk.lo && x.date <= wk.hi);
    // с 19.10 индивидуалка ведётся в дневниках: старую сетку за такие недели не рисуем
    if (!wtr.length && (D.diary || []).some(x => x.date >= wk.lo && x.date <= wk.hi)) return '';
    const old = wtr.some(x => !x.st) ? '<p class="muted small">В эту неделю прочерк от пустой клетки ещё не отличали, пустое не отмечено.</p>' : '';
    const legend = `<div class="legend ileg">${TTAG.map(([, l, c]) => `<span><span class="tt ${c}">${l}</span></span>`).join('')}<span class="muted">приглушён выходной</span></div><p class="irule">${IRULE}</p>${old}`;
    const byNick = nick => new Map(wtr.filter(x => x.p === nick).map(x => [x.date, x]));
    const holeTxt = hs => `не заполнил ${plural(hs.cells, 'клетку', 'клетки', 'клеток')} за ${plural(hs.days, 'день', 'дня', 'дней')}`;
    let body;
    if (nicks.length === 1) {                       // один игрок: дни сверху вниз, так читается и на телефоне
      const by = byNick(nicks[0]), hs = holeSum([...by.values()]);
      body = `<div class="card ilist">${hs.cells ? `<p class="ihead crit">${holeTxt(hs)}</p>` : ''}${days.map(d => `<div class="iday${isOff(d) ? ' off' : ''}"><div class="dd"><b>${wday(d)} ${ddmm(d)}</b><small>${esc(DTYPE(dayInfo(d).type))}</small></div>`

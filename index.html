  const hbarHtml = (v, cls = '') => `<span class="hb ${cls}"><i class="${htier(v)}" style="width:${v == null ? 0 : Math.max(1.5, v).toFixed(1)}%"></i></span>`;
  function hltvSeg() {
    if (!HK.length) return '';
    return `<div class="hside" role="group" aria-label="Атрибуты HLTV: сторона">${[['both', 'обе стороны'], ['CT', 'CT'], ['T', 'T']].map(([v, l]) => `<button type="button" data-hside="${v}" aria-pressed="${S.hside === v}">${l}</button>`).join('')}</div>`;
  }
  /* Атрибуты в карточке игрока, Рома 05.10: «соедини это со статой выше, а не отдельно внизу». */
  function hltvIn(nick, ms) {
    if (!HK.length) return '';
    const side = S.hside, {c, maps, offs} = hsum(ms.filter(m => m.players.some(p => p.h)), nick, side);
    const what = !offs ? 'только праки' : offs === maps ? 'только офки' : `из них офок ${offs}`;
    const head = `<div class="k">Атрибуты HLTV <span class="muted">${side === 'both' ? 'обе стороны' : side} · ${c.r ? `${mapsN(maps)}, ${plural(c.r, 'раунд', 'раунда', 'раундов')}, ${what}` : 'матчей с разбором по раундам за период нет'}</span></div>`;
    if (!c.r) return `<div class="hin">${head}</div>`;
    const at = hattrs(c, side);
    const sel = at.find(x => x.a.name === S.hsel[nick]) || at[0];
    const main = at.map(x => `<button type="button" class="hrow${x === sel ? ' on' : ''}" data-hattr="${x.a.name}" data-hnick="${esc(nick)}" aria-pressed="${x === sel}">`
      + `<span class="hn">${x.a.name}</span>${hbarHtml(x.score)}<span class="hv"><b>${x.score ?? '—'}</b>/100</span></button>`).join('');
    const det = `<div class="hdet" aria-live="polite"><div class="hbt"><b>${sel.a.name}</b> <span class="muted">${sel.a.ru}${sel.a.approx ? ' · приближённо' : ''}</span><span class="hv"><b>${sel.score ?? '—'}</b>/100</span></div>`
      + sel.rows.map(y => `<div class="hsub${y.w ? ' w' : ''}"><span class="hl">${esc(y.label)}</span><span class="hx">${y.v == null ? '—' : y.v.toFixed(y.dec)}</span>${hbarHtml(y.bar, 'sm')}</div>`).join('')
      + (sel.a.note ? `<p class="muted small">${esc(sel.a.note)}</p>` : '') + '</div>';
    return `<div class="hin">${head}<div class="hsplit"><div class="hmain" role="group" aria-label="Атрибуты, нажми, чтобы увидеть показатели">${main}</div>${det}</div>
        <p class="muted small">0–100 как на HLTV: 50 это средний игрок топ-сцены, против слабых соперников цифры выше. Справа показатели атрибута, на который нажал; жирным то, из чего складывается оценка. Праки считаются по повторам праккома, офки по демкам с Faceit.</p>
      </div>`;
  }

  // ══ Индивидуалка ══
  /* Неделя сеткой: игроки по строкам, дни по столбцам, в клетке метки разминка / микро / макро.
     Рома 05.10: «когда там просто подряд всё идёт, очень тяжело считывается». Сверху задание
     недели, выходные приглушены. Сетка всегда за выбранную неделю: индивидуалка недельная. */
  const DTYPE = t => { const x = String(t || '').toLowerCase();
    return /off/.test(x) ? 'выходной' : /theory|теор/.test(x) ? 'теория' : /important|game|игр/.test(x) ? 'игровой день' : /practice|прак/.test(x) ? 'праки' : String(t || ''); };
  const weekDays = wk => { const d0 = new Date(wk.lo + 'T12:00:00'), out = [];
    for (let i = 0; i < 7; i++) { const d = new Date(d0); d.setDate(d0.getDate() + i); out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`); }
    return out; };
  const dayInfo = d => (D.idays || {})[d] || {};
  const isOff = d => DTYPE(dayInfo(d).type) === 'выходной';
  const TTAG = [['warmup', 'разминка', 'tw'], ['micro', 'микро', 'tm'], ['macro', 'макро', 'tc']];
  const trItems = x => TTAG.filter(([k]) => x[k]).map(([k, l, c]) => `<div class="ti"><span class="tt ${c}">${l}</span><span>${esc(x[k])}</span></div>`).join('');
  function secIndividual() {
    const wk = W[S.week], days = weekDays(wk);
    const nicks = S.player === 'all' ? D.roster.map(r => r.nick) : [S.player];
    const tasks = [...new Set(days.map(d => dayInfo(d).task).filter(Boolean))];
    const task = tasks.length ? `<div class="card task"><span class="k">задание недели</span>${tasks.map(t => `<p>${esc(t)}</p>`).join('')}</div>` : '';
    const legend = `<div class="legend ileg">${TTAG.map(([, l, c]) => `<span><span class="tt ${c}">${l}</span></span>`).join('')}<span class="muted">приглушён выходной</span></div>`;
    const byNick = nick => new Map(D.training.filter(x => x.p === nick && x.date >= wk.lo && x.date <= wk.hi).map(x => [x.date, x]));
    let body;
    if (nicks.length === 1) {                       // один игрок: дни сверху вниз, так читается и на телефоне
      const by = byNick(nicks[0]);
      body = `<div class="card ilist">${days.map(d => `<div class="iday${isOff(d) ? ' off' : ''}"><div class="dd"><b>${wday(d)} ${ddmm(d)}</b><small>${esc(DTYPE(dayInfo(d).type))}</small></div>`
        + `<div>${by.has(d) ? trItems(by.get(d)) : '<span class="muted">ничего</span>'}</div></div>`).join('')}${legend}</div>`;
    } else {
      const head = '<tr><th></th>' + days.map(d => `<th class="dcol${isOff(d) ? ' off' : ''}"><b>${wday(d)}</b> ${ddmm(d)}<small>${esc(DTYPE(dayInfo(d).type))}</small></th>`).join('') + '<th class="num">дней</th></tr>';
      const rows = nicks.map(nick => {
        const by = byNick(nick);
        return `<tr><th class="nick">${esc(nick)}</th>` + days.map(d => `<td class="icell${isOff(d) ? ' off' : ''}">${by.has(d) ? trItems(by.get(d)) : '<span class="none">—</span>'}</td>`).join('')
          + `<td class="num"><b>${by.size}</b>/7</td></tr>`;
      }).join('');
      body = `<div class="card"><div class="scroll"><table class="itab">${head}${rows}</table></div>${legend}</div>`;
    }
    return section(`Индивидуалка ${ddmm(wk.lo)} — ${ddmm(wk.hi)}`, task + body);
  }

  // ══ Итог недели ══
  /* Итог и план со слов IGL стоят сразу под командой. Темы пракков и записи по дням сняты,
     Рома 05.10: «темы самые разные, расписывать спорно». В конце недели он даёт отчёт
     и оценку, они и встают сюда. */
  function secWeekReport() {
    const wk = W[S.week], pw = S.week > 0 ? W[S.week - 1] : null;
    const inR = (e, w) => w && e.date && e.date >= w.lo && e.date <= w.hi;
    const it = D.journal.filter(e => e.kind === 'итог' && inR(e, wk)).pop();
    const itp = D.journal.filter(e => e.kind === 'итог' && inR(e, pw)).pop();
    const plan = D.journal.filter(e => e.kind === 'план' && inR(e, wk));
    const was = new Map(((itp && itp.scores) || []).map(([k, v]) => [k, v]));
    const scores = ((it && it.scores) || []).map(([k, v]) => `<div class="score"><div class="k">${esc(k)}</div><div class="big">${v}</div>${delta(v, was.has(k) ? was.get(k) : null, 1)}</div>`).join('');
    const notes = ((it && it.notes) || []).map(noteLine).join('');
    const planHtml = plan.length ? `<ul>${plan.flatMap(e => e.lines).map(l => `<li>${esc(l.replace(/^[-•*]\s*/, ''))}</li>`).join('')}</ul>` : '<p class="muted">План не записан.</p>';

    // думалка: только игроки, IGL несёт идеи сразу на сбор
    const igl = new Set(D.roster.filter(r => r.rkey === 'igl').map(r => r.nick));
    const ideas = D.ideas.filter(x => inR(x, wk)), c = new Map();
    for (const x of ideas) c.set(x.who, (c.get(x.who) || 0) + 1);
    const who = D.roster.map(r => r.nick).filter(n => !igl.has(n))
      .concat([...c.keys()].filter(n => !D.roster.some(r => r.nick === n)));
    const fate = ideaCounts(wk);
    const three = fate ? `<span class="three"><i>внесли <b>${fate.in ?? '—'}</b></i><i class="good">взяли на тест <b>${fate.test ?? '—'}</b></i><i class="crit">отклонили <b>${fate.no ?? '—'}</b></i></span>` : '';
    const dum = `<div class="card stack dum"><b>Думалка за неделю</b><span>${who.map(n => `${esc(n)} <b>${c.get(n) || 0}</b>`).join(' · ')}</span>${three}</div>`;

    const revs = D.journal.filter(e => e.kind === 'разбор' && inR(e, wk));
    const revHtml = revs.length ? `<div class="card stack"><h3>Разборы</h3>${revs.map(e => `<div class="rev"><b>${ddmm(e.date)} · ${esc(e.title)}</b>${e.lines.map(noteLine).join('')}</div>`).join('')}</div>` : '';

    const signals = [];
    const idx = trendIdx();
    for (const r of D.roster) {
      const ser = idx.map(i => agg(rowsOf(pick(weekR(i)), r.nick)));
      const fr = falling(ser.map(x => x.rating), 0.01, idx), fg = falling(ser.map(x => x.hd), 0.05, idx);
      if (fr) signals.push(`${esc(r.nick)}: рейтинг четыре недели подряд вниз, ${ddmm(fr.from)}–${ddmm(fr.to)}, ${fr.vals.map(v => v.toFixed(2)).join(' → ')}`);
      if (fg) signals.push(`${esc(r.nick)}: голова четыре недели подряд вниз, ${fg.vals.map(v => v.toFixed(1)).join(' → ')}${fg.from < HEAD_FROM ? '. ' + HX_NOTE : ''}`);
    }
    const worst = byMap(pick(cur(), false)).map(([m, l]) => { const t = tally(l); return [m, t.w + t.l ? t.w / (t.w + t.l) : null, t.w + t.l]; })
      .filter(x => x[1] != null && x[2] >= 3).sort((p, q) => p[1] - q[1])[0];
    if (worst) signals.push(`хуже всего карта ${esc(worst[0])}: ${Math.round(100 * worst[1])}% на ${mapsN(worst[2])}`);

    return section(`Итог недели ${ddmm(wk.lo)} — ${ddmm(wk.hi)}`, `
      <div class="grid two">
        <div class="card"><h3>Оценка недели <span class="muted">IGL, 1–5</span></h3>${scores ? `<div class="scores">${scores}</div>` : '<p class="muted">Итог не записан.</p>'}${notes}</div>
        <div class="card"><h3>План на следующую неделю</h3>${planHtml}</div>
      </div>
      ${dum}${revHtml}
      <div class="card stack"><h3>Сигналы из цифр <span class="muted">сам отчёт, без решений</span></h3>${signals.length ? `<ul>${signals.map(x => `<li>${x}</li>`).join('')}</ul>` : '<p class="muted">Ничего тревожного.</p>'}</div>`);
  }

  // ══ управление ══
  function initControls() {
    document.getElementById('team').textContent = D.team;
    document.getElementById('sample').hidden = !D.sample;
    const lvl = document.getElementById('f-lvl');
    const seen = new Set(D.matches.map(lvlOf));
    // лестница показывается целиком: разница между тиром 1 и тиром 3 важнее пустого чипа.
    // «No» и «OPEN» появляются, только если на них реально играли.
    const order = D.levels.filter(x => !['No', 'OPEN'].includes(x) || seen.has(x))
      .concat(seen.has(NOLVL) ? [NOLVL] : []);
    lvl.innerHTML = '<span class="k">уровень</span><button type="button" data-v="">любой</button>'
      + order.map(k => `<button type="button" data-v="${esc(k)}"${seen.has(k) ? '' : ' class="none"'}>${esc(k)}</button>`).join('');
    const fm = document.getElementById('f-map');
    fm.innerHTML = '<option value="all">все</option>' + [...new Set(D.matches.map(m => m.map).filter(Boolean))].sort().map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
    const fp = document.getElementById('f-player');
    fp.innerHTML = '<option value="all">все</option>' + D.roster.map(r => `<option value="${esc(r.nick)}">${esc(r.nick)}</option>`).join('');
    lvl.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      const v = b.dataset.v;
      if (!v) S.lvls.clear();
      else if (S.lvls.has(v)) S.lvls.delete(v);
      else S.lvls.add(v);
      render();
    });
    fm.onchange = e => { S.map = e.target.value; render(); };
    fp.onchange = e => { S.player = e.target.value; render(); };
    document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S[seg.dataset.key] = b.dataset.v; render(); }));
    const app = document.getElementById('app');
    app.addEventListener('click', e => {
      const hs = e.target && e.target.closest ? e.target.closest('[data-hside]') : null;
      if (hs) { S.hside = hs.dataset.hside; S.focus = 'hside:' + S.hside; render(); return; }
      const ha = e.target && e.target.closest ? e.target.closest('[data-hattr]') : null;
      if (ha) { S.hsel[ha.dataset.hnick] = ha.dataset.hattr; S.focus = {nick: ha.dataset.hnick, attr: ha.dataset.hattr}; render(); return; }
      const b = e.target && e.target.closest ? e.target.closest('[data-gnav]') : null;
      if (!b) return;
      S.gp += Number(b.dataset.gnav); S.focus = b.dataset.gnav; render();
    });
    app.addEventListener('change', e => { if (e.target && e.target.id === 'gcmp') { S.gcmp = e.target.value; S.focus = 'gcmp'; render(); } });
    document.getElementById('wprev').onclick = () => { if (S.week > 0) { S.week--; render(); } };
    document.getElementById('wnext').onclick = () => { if (S.week < W.length - 1) { S.week++; render(); } };
  }
  function render() {
    document.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(S[seg.dataset.key] === b.dataset.v))));
    document.querySelectorAll('#f-lvl button').forEach(b => b.setAttribute('aria-pressed',
      String(b.dataset.v ? S.lvls.has(b.dataset.v) : S.lvls.size === 0)));
    const wk = W[S.week];
    document.getElementById('wlabel').textContent = `${ddmm(wk.lo)} — ${ddmm(wk.hi)}`;
    document.getElementById('wprev').disabled = S.week === 0;
    document.getElementById('wnext').disabled = S.week === W.length - 1;
    const tail = secMaps() + secMatches();
    const qa = typeof document.querySelectorAll === 'function' ? sel => [...document.querySelectorAll(sel)] : () => [];
    const opened = new Set(qa('#app details.match[open]').map(d => d.dataset.k));
    document.getElementById('app').innerHTML = S.player === 'all'
      ? secTeam() + secWeekReport() + secIndividual() + secPlayers() + tail
      : secTeam() + secWeekReport() + secIndividual() + secPlayers() + secPlayer(S.player) + tail;
    if (opened.size) qa('#app details.match').forEach(d => { if (opened.has(d.dataset.k)) d.open = true; });
    if (S.focus && typeof document.querySelector === 'function') {
      const b = typeof S.focus === 'object'
        ? [...document.querySelectorAll('[data-hattr]')].find(x => x.dataset.hnick === S.focus.nick && x.dataset.hattr === S.focus.attr)
        : S.focus === 'gcmp' ? document.getElementById('gcmp')
        : S.focus.startsWith('hside:') ? document.querySelector(`[data-hside="${S.focus.slice(6)}"]`)
        : document.querySelector(`[data-gnav="${S.focus}"]`);
      if (b) b.focus();
    }
    S.focus = null;
  }
  if (D.empty) {
    document.getElementById('team').textContent = D.team;
    document.querySelector('.filters').hidden = true;
    document.getElementById('app').innerHTML =
      `<section class="sec"><div class="card"><h3>${esc(D.title || 'Пока пусто')}</h3>`
      + `<p class="muted">${esc(D.note || '')}</p></div></section>`;
    return;
  }
  initControls();
  render();
}

(async () => {
  const raw = JSON.parse(document.getElementById('data').textContent);
  if (!raw.locked) { start(raw); return; }
  const L = raw.locked, KEY = 'team-dashboard-pass';
  const wrap = document.getElementById('wrap'), gate = document.getElementById('gate');
  const form = document.getElementById('gate-form'), err = document.getElementById('gate-err');
  const btn = form.querySelector('button');
  document.getElementById('gate-team').textContent = L.team || 'Команда';
  wrap.hidden = true;
  const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  async function unlock(pass) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: bytes(L.salt), iterations: L.iter, hash: 'SHA-256'},
      base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes(L.iv)}, key, bytes(L.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function open(D) {
    gate.hidden = true;
    wrap.hidden = false;
    const out = document.getElementById('logout');
    out.hidden = false;
    out.onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); };
    start(D);
  }
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    try { open(await unlock(saved)); return; } catch (e) { try { localStorage.removeItem(KEY); } catch (e2) {} }
  }
  gate.hidden = false;
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    err.hidden = true;
    btn.disabled = true;
    btn.textContent = 'Проверяю…';
    const pass = document.getElementById('gate-pass').value;
    try {
      const D = await unlock(pass);
      if (document.getElementById('gate-remember').checked) { try { localStorage.setItem(KEY, pass); } catch (e) {} }
      open(D);
    } catch (e) {
      err.hidden = false;
      btn.disabled = false;
      btn.textContent = 'Открыть';
    }
  });
})();
</script>
